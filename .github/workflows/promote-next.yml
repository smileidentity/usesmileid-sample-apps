name: Promote next

# Opens the release's next-into-main pull request from a copy of next; docs/source-build.md says why.

on:
  workflow_dispatch:
    inputs:
      release:
        description: The SDK version that shipped (e.g. 12.4.0)
        required: true
        type: string

concurrency:
  group: promote-next
  cancel-in-progress: false

# The pull request is opened with a token so its checks run: one opened with GITHUB_TOKEN starts none.
permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    env:
      GH_TOKEN: ${{ secrets.PROMOTE_NEXT_TOKEN }}
      REPO: ${{ github.repository }}
      # Read through env, so the input can't inject shell.
      RELEASE: ${{ inputs.release }}
    steps:
      - name: Open the next into main pull request
        run: |
          version="${RELEASE}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${RELEASE}' is not a release version such as 12.4.0"
            exit 1
          fi
          # Each read is assigned before it is compared, so a failed call stops the run instead of passing.
          main_tree=$(gh api "repos/${REPO}/commits/main" --jq .commit.tree.sha)
          next_tree=$(gh api "repos/${REPO}/commits/next" --jq .commit.tree.sha)
          changed=$(gh api "repos/${REPO}/compare/main...next" --jq '.files | length')
          if [ -z "${main_tree}" ] || [ -z "${next_tree}" ] || [ -z "${changed}" ]; then
            echo "::error::could not read main and next"
            exit 1
          fi
          if [ "${main_tree}" = "${next_tree}" ] || [ "${changed}" = 0 ]; then
            echo "::notice::main already holds everything on next, so there is nothing to promote"
            exit 0
          fi
          branch="sync/next-into-main-${version}"
          # One promotion is open at a time, named for the latest release: an older one is replaced once this one is open.
          heads=$(gh api "repos/${REPO}/pulls?base=main&state=open&per_page=100" --jq '.[] | select(.head.repo.full_name
            == .base.repo.full_name and (.head.ref | test("^sync/next-into-main-[0-9]+\\.[0-9]+\\.[0-9]+$"))) | .head.ref')
          older=()
          for open in $(grep -v -x -F "${branch}" <<<"${heads}" || true); do
            other="${open#sync/next-into-main-}"
            if [ "$(printf '%s\n%s\n' "${other}" "${version}" | sort -V | tail -1)" = "${other}" ]; then
              echo "::error::the ${other} promotion is open, which is newer than ${version}; run this with ${other} or a later version"
              exit 1
            fi
            older+=("${open}")
          done
          sha=$(gh api "repos/${REPO}/git/ref/heads/next" --jq .object.sha)
          if gh api "repos/${REPO}/git/ref/heads/${branch}" --silent 2>/dev/null; then
            behind=$(gh api "repos/${REPO}/compare/${branch}...next" --jq .behind_by)
            if [ "${behind}" != 0 ]; then
              echo "::error::${branch} has commits next doesn't, such as a conflict resolution; close its pull request, delete the branch, resolve any conflict by merging main into next, then run this again"
              exit 1
            fi
            gh api -X PATCH "repos/${REPO}/git/refs/heads/${branch}" -f sha="${sha}" --silent
          else
            gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/heads/${branch}" -f sha="${sha}" --silent
          fi
          cat >"${RUNNER_TEMP}/body.md" <<EOF
          ## Why this change

          ${version} has shipped, so \`main\` takes the changes \`next\` held for it, and the SDK repositories can pin \`main\` again.

          ## Before merging

          - [ ] This pull request's checks build every platform against the released ${version}, and they pass.
          - [ ] Nothing on \`next\` needs an SDK newer than ${version}. If something does, leave this open; when that version ships, run Promote next with it, which replaces this pull request.
          - [ ] No conflicts. If there are, merge \`main\` into \`next\` and run Promote next again; never resolve them on this branch.

          ## After merging

          - Merge \`main\` back into \`next\`.
          - Run \`bump_sample_apps.yaml\` in each SDK repository, to pin \`main\`.

          This branch is a copy of \`next\` at ${sha:0:8}, so the branch deletion that follows the merge leaves \`next\` as it is.
          EOF
          if grep -q -x -F "${branch}" <<<"${heads}"; then
            gh pr edit "${branch}" -R "${REPO}" --body-file "${RUNNER_TEMP}/body.md"
            echo "::notice::the pull request from ${branch} was already open; its branch and description now match next"
          else
            gh pr create -R "${REPO}" --base main --head "${branch}" \
              --title "🔀 sync: next into main, now that ${version} has shipped" --body-file "${RUNNER_TEMP}/body.md"
          fi
          for old in "${older[@]}"; do
            if [ "$(gh api "repos/${REPO}/compare/${old}...next" --jq .behind_by)" = 0 ]; then
              gh pr close "${old}" -R "${REPO}" --delete-branch --comment "Replaced by the ${version} promotion."
            else
              gh pr close "${old}" -R "${REPO}" --comment "Replaced by the ${version} promotion. Its branch has commits next doesn't, so it stays."
            fi
          done
