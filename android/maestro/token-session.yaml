# The token session, end to end on a locally minted fixture token: a simulated scan links it, the
# countdown reads the token's own span, a consent-bound run starts at instructions with no consent
# screen at all, an expired session turns the journey back at the gate, and manual entry rejects
# something that is not a token.
#
# What a fixture token cannot prove, and what still needs a Portal token by hand: a server accepting
# it, and scanning the QR itself.
#
# The token is never asserted on — Maestro dumps the view hierarchy on failure, so it reaches no
# `testTag`ged node and no assertion here. The scan screen's field is masked for the same reason.
# APP_ID must be passed — see shell-navigation.yaml for why it has no default.
appId: ${APP_ID}
---
- stopApp
- launchApp
- runFlow: subflows/warm-start.yaml

# A 15m simulated scan: the countdown is the decoded span, which a hard-coded five minutes could not
# produce. The duration and the bindings are chosen on the sheet, so the mint is not a fixed fixture.
- tapOn:
    id: "sample_nav_token"
- extendedWaitUntil:
    visible:
      id: "sample_scan_token_screen"
    timeout: 10000
# The host owns a camera now, so the FIRST permission prompt in this app is ours, not the SDK's —
# two requesters in one app, which is what §7.1 wanted this sample to demonstrate.
#
# The settle is load-bearing, not decoration: the scanner asks on mount and the dialog animates in a
# beat later, so an immediate `when: visible:` check reads SKIPPED and the dialog then swallows the
# next tap — which is exactly how a chip tap silently granted the permission instead of choosing a
# duration. Conditional because the grant outlives both stopApp and the install, and ColorOS refuses
# `pm grant`.
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        id: "com.android.permissioncontroller:id/permission_allow_foreground_only_button"
    commands:
      - tapOn:
          id: "com.android.permissioncontroller:id/permission_allow_foreground_only_button"
- assertVisible:
    id: "sample_scan_token_screen"
- tapOn:
    id: "sample_token_simulate"
- assertVisible:
    id: "sample_products_screen"
- assertVisible:
    id: "sample_session_card"
- assertVisible:
    id: "sample_session_countdown"
    text: "1[45]:[0-9]{2}"

# An 8h token, which is where the old m:ss format overflowed. Its consent binding is complete, so the
# SDK drops its own consent screen for the run below.
- tapOn:
    id: "sample_nav_token"
- assertVisible:
    id: "sample_scan_token_screen"
- tapOn: "8h"
- tapOn: "Binds consent"
- tapOn:
    id: "sample_token_simulate"
- assertVisible:
    id: "sample_products_screen"
- assertVisible:
    id: "sample_session_countdown"
    text: "[78]:[0-9]{2}:[0-9]{2}"

# The token-bound journey: a different journey from sdk-flow.yaml's, which describes the no-token path.
- tapOn:
    id: "sample_product_card_smartSelfieEnrollment"
- assertVisible:
    id: "sample_user_details_screen"
- tapOn:
    id: "sample_user_details_field_firstName"
- inputText: "Ada"
- tapOn:
    id: "sample_user_details_field_lastName"
- inputText: "Okafor"
# The SDK requires a contact field even though the form labels both optional.
- tapOn:
    id: "sample_user_details_field_email"
- inputText: "ada.okafor@example.com"
- hideKeyboard
- tapOn:
    id: "sample_user_details_continue"
# Conditional because the grant outlives the install, and ColorOS refuses `pm grant` — see README.
- runFlow:
    when:
      visible:
        id: "com.android.permissioncontroller:id/permission_allow_foreground_only_button"
    commands:
      - tapOn:
          id: "com.android.permissioncontroller:id/permission_allow_foreground_only_button"
# The token carries consent, so the flow the SDK runs has no consent screen to show.
- assertVisible:
    id: "si_instructions_screen"
- assertNotVisible:
    id: "si_consent_screen"
# Release-on-leave: the scan screen had the camera bound moments ago, so the SDK advancing into
# capture is the host having handed it back. It proves the handoff, not that the preview renders —
# the SDK's capture screen carries no si_* id, so a live-preview assertion has no home here.
- tapOn: "Next"
- assertNotVisible:
    id: "si_instructions_screen"
# Back out of capture: the SDK consumes it and reports exactly one terminal result.
- back
- assertVisible:
    id: "sample_products_screen"
- tapOn:
    id: "sample_nav_verifications"
- tapOn:
    id: "sample_job_row_0"
- assertVisible:
    id: "sample_result_result_count"
    text: "1"
- back
- tapOn:
    id: "sample_nav_products"
- assertVisible:
    id: "sample_products_screen"

# An expired session is the one outcome no form can fix, so the gate routes to the scanner rather
# than to the SDK — even with the details the previous run left filled in.
- tapOn:
    id: "sample_nav_token"
- tapOn: "Expired"
- tapOn:
    id: "sample_token_simulate"
- assertVisible:
    id: "sample_products_screen"
- assertVisible:
    id: "sample_session_ended_banner"
- tapOn:
    id: "sample_product_card_smartSelfieEnrollment"
- assertVisible:
    id: "sample_user_details_screen"
- tapOn:
    id: "sample_user_details_continue"
- assertVisible:
    id: "sample_scan_token_screen"
- assertNotVisible:
    id: "si_instructions_screen"

# Manual entry: a rejection carries its reason and links nothing, so the expired session still stands.
- tapOn:
    id: "sample_token_manual_entry"
- inputText: "not-a-jwt"
- hideKeyboard
- tapOn: "Link token"
- assertVisible: "three dot-separated base64url segments"
- assertVisible:
    id: "sample_scan_token_screen"
- back
- assertVisible:
    id: "sample_products_screen"
- assertVisible:
    id: "sample_session_ended_banner"
- stopApp
