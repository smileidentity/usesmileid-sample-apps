# Leaves the details form's save switch off, so a run stores no profile. It ships on, but a second
# pass in the same session finds it already off, since with no profile the form keeps what was typed.
appId: ${APP_ID}
---
- runFlow:
    when:
      visible:
        id: "sample_remember_details_switch"
        checked: true
    commands:
      - tapOn:
          id: "sample_remember_details_switch"
- assertVisible:
    id: "sample_remember_details_switch"
    checked: false
