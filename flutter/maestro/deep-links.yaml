appId: ${APP_ID}
---
# `spec/routes.json` requires every route to open cold AND warm; the warm half served go_router's
# error page until the router learned to fold a whole link. APP_ID — see ../README.md "Traps".

- runFlow:
    file: subflows/cold-start.yaml
    env:
      LINK: "usesmileid-sample-flutter://settings?catalogue=fixture"
      LANDS_ON: "sample_settings_screen"

- runFlow:
    file: subflows/cold-start.yaml
    env:
      LINK: "usesmileid-sample-flutter://settings/licenses?catalogue=fixture"
      LANDS_ON: "sample_licenses_screen"

# Mid-run, which is the entry spec/routes.json documents for reaching the drawer from a flow.
- runFlow:
    file: subflows/cold-start.yaml
    env:
      LINK: "usesmileid-sample-flutter://?catalogue=fixture"
      LANDS_ON: "sample_products_screen"
- openLink: "usesmileid-sample-flutter://debug/scenarios"
- assertVisible:
    id: "sample_scenario_drawer"

# Presented above the shell: the bar is out of reach, and the last row takes its own tap.
- assertNotVisible:
    id: "sample_nav_settings"
- tapOn:
    id: "sample_theme_item_partnerOverride"
    retryTapIfNoChange: true
- assertVisible:
    id: "sample_theme_item_partnerOverride"
    selected: true
- back
- assertVisible:
    id: "sample_settings_screen"
# The bar belongs to the page behind the scrim, so dismissing gives it back.
- assertVisible:
    id: "sample_nav_settings"

# Dismissing left the router at /debug/scenarios, so a second delivery reopened nothing.
- openLink: "usesmileid-sample-flutter://debug/scenarios"
- assertVisible:
    id: "sample_scenario_drawer"
- back

# A mid-run link navigates but never re-seeds: arguments are read once, before the first frame.
- clearState
- runFlow:
    file: subflows/cold-start.yaml
    env:
      LINK: "usesmileid-sample-flutter://?catalogue=fixture"
      LANDS_ON: "sample_products_screen"
- openLink: "usesmileid-sample-flutter://verifications?seedJobs=true"
- assertVisible:
    id: "sample_verifications_empty"

# The appearance sheet by its link: System ships selected, a pick lands on the row and persists.
- runFlow:
    file: subflows/cold-start.yaml
    env:
      LINK: "usesmileid-sample-flutter://settings/appearance?catalogue=fixture"
      LANDS_ON: "sample_appearance_sheet"
- assertVisible:
    id: "sample_appearance_option_system"
    selected: true
- tapOn:
    id: "sample_appearance_option_dark"
- assertNotVisible:
    id: "sample_appearance_sheet"
# Flutter merges the row's two lines into its own label, so the pick is read back from the sheet below.
- assertVisible:
    id: "sample_setting_appearance"
- openLink: "usesmileid-sample-flutter://settings/appearance"
- assertVisible:
    id: "sample_appearance_option_dark"
    selected: true
- tapOn:
    id: "sample_appearance_option_system"

# The language sheet by its link: a pick applies at once, and System restores the device's.
- runFlow:
    file: subflows/cold-start.yaml
    env:
      LINK: "usesmileid-sample-flutter://settings/language?catalogue=fixture"
      LANDS_ON: "sample_language_sheet"
- assertVisible:
    id: "sample_language_option_system"
    selected: true
- tapOn:
    id: "sample_language_option_fr"
- assertNotVisible:
    id: "sample_language_sheet"
- assertVisible: "Réglages"
- openLink: "usesmileid-sample-flutter://settings/language"
- assertVisible:
    id: "sample_language_option_fr"
    selected: true
- tapOn:
    id: "sample_language_option_system"
- assertVisible: "Settings"
