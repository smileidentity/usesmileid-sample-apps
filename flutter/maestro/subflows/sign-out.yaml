# Sign out and confirm: the clean slate, since `clearState` is unusable on some OEMs.
appId: ${APP_ID}
---
# Settled first: straight after a cold start the tab bar can take the tap before it answers it.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "sample_nav_settings"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      notVisible:
        id: "sample_settings_screen"
    commands:
      - tapOn:
          id: "sample_nav_settings"
- extendedWaitUntil:
    visible:
      id: "sample_settings_screen"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "sample_sign_out"
    direction: DOWN
    visibilityPercentage: 80
    timeout: 45000
# To the list's end, whose padding clears the floating nav bar that would otherwise take the tap.
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "sample_sign_out"
- tapOn:
    id: "sample_sign_out_confirm"
- assertVisible:
    id: "sample_products_screen"
