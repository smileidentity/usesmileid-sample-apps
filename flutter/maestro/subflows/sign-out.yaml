# Settings → Sign out → confirm, which ends the session and deletes every profile: the clean slate a
# flow that stores a profile starts and ends from, since `clearState` is unusable on some OEMs.
appId: ${APP_ID}
---
- tapOn:
    id: "sample_nav_settings"
- scrollUntilVisible:
    element:
      id: "sample_sign_out"
    direction: DOWN
    visibilityPercentage: 80
    timeout: 45000
- tapOn:
    id: "sample_sign_out"
- tapOn:
    id: "sample_sign_out_confirm"
- assertVisible:
    id: "sample_products_screen"
