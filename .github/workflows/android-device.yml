name: Android device

# The Android Maestro suite on an emulator. A pull request runs only the flows its paths reach, in
# debug; a merge to main, the nightly run and a pull request that touches packaging run every flow
# against the minified release build, which is where a consumption defect surfaces. The label
# `device-suite:all` forces the full suite on a pull request.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'android/**'
      - 'spec/**'
      - 'scripts/select_android_flows.py'
      - '.github/workflows/android-device.yml'
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      variant: ${{ steps.plan.outputs.variant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Choose the flows
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          FORCE_ALL: ${{ contains(github.event.pull_request.labels.*.name, 'device-suite:all') }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [ "$FORCE_ALL" = "true" ]; then
            plan=$(python3 scripts/select_android_flows.py --all)
          else
            plan=$(git diff --name-only "$BASE"...HEAD | python3 scripts/select_android_flows.py)
          fi
          echo "$plan"
          # Two shards, each a separate runner: the suite is too long for one, and one runner has no RAM for two emulators.
          python3 - "$plan" >> "$GITHUB_OUTPUT" <<'EOF'
          import json, sys
          plan = json.loads(sys.argv[1])
          shards = [s for s in (plan["flows"][0::2], plan["flows"][1::2]) if s]
          print("shards=" + json.dumps([" ".join(s) for s in shards]))
          print("variant=" + plan["variant"])
          EOF
          echo "### Android device flows ($(echo "$plan" | python3 -c 'import json,sys;p=json.load(sys.stdin);print(p["variant"], "-", p["reason"])'))" >> "$GITHUB_STEP_SUMMARY"

  flows:
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        flows: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7

      # The build fills this runner and the emulator package then has nowhere to land.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/share/swift \
            /usr/local/share/powershell /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the APK
        working-directory: android
        env:
          VARIANT: ${{ needs.plan.outputs.variant }}
        run: ./gradlew ":app:assemble${VARIANT^}"

      # The daemons hold a heap this runner needs back before an emulator will fit beside it.
      - name: Stop the Gradle and Kotlin daemons
        working-directory: android
        run: |
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The emulator needs nested virtualisation, which is not granted to the runner user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Name the build under test
        env:
          VARIANT: ${{ needs.plan.outputs.variant }}
        run: |
          if [ "$VARIANT" = release ]; then
            echo "APP_ID=com.usesmileid.sample.android" >> "$GITHUB_ENV"
          else
            echo "APP_ID=com.usesmileid.sample.android.debug" >> "$GITHUB_ENV"
          fi
          echo "APK=android/app/build/outputs/apk/$VARIANT/app-$VARIANT.apk" >> "$GITHUB_ENV"
          echo "FLOWS=$(for f in ${{ matrix.flows }}; do printf 'android/maestro/%s.yaml ' "$f"; done)" >> "$GITHUB_ENV"

      - name: Run the device flows
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # A lock or a system ANR dialog reds every flow as the app's fault; an app crash still lands in logs/crash-report.txt.
          script: |
            adb shell locksettings set-disabled true
            adb shell settings put global hide_error_dialogs 1
            adb install -r "$APK"
            maestro test -e APP_ID="$APP_ID" $FLOWS

      # A red here is a screen recording and a hierarchy, which is what makes it readable at all.
      - name: Upload the Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-device-debug-${{ strategy.job-index }}
          path: ~/.maestro/tests/**
          if-no-files-found: ignore
          retention-days: 7
