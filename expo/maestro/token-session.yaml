appId: ${APP_ID}
---
# The token session on fixture tokens: Simulate, the countdown, bound runs, and the expiry gate's resume.
# Details are bound, not typed: this runner loses the hierarchy once a field is focused (README "Traps").

# Only clearing the app's data removes the stored session.
- clearState
- stopApp
- openLink: "usesmileid-sample-expo://?noticeWindow=60"
- runFlow: subflows/warm-start.yaml

- tapOn:
    id: "sample_nav_token"
# The host's own camera prompt comes before the SDK's.
- runFlow:
    when:
      visible:
        id: "com.android.permissioncontroller:id/permission_allow_foreground_only_button"
    commands:
      - tapOn:
          id: "com.android.permissioncontroller:id/permission_allow_foreground_only_button"
- assertVisible:
    id: "sample_scan_token_screen"
- tapOn:
    id: "sample_token_simulate"
- extendedWaitUntil:
    visible:
      id: "sample_session_card"
    timeout: 10000
- assertVisible:
    id: "sample_session_countdown"
    text: "1[45]:[0-9]{2}"

- tapOn:
    id: "sample_nav_token"
- assertVisible:
    id: "sample_scan_token_screen"
- tapOn: "SIMULATED SCAN"
- tapOn: "8h"
- tapOn:
    id: "sample_token_simulate"
- extendedWaitUntil:
    visible:
      id: "sample_session_countdown"
      text: "[78]:[0-9]{2}:[0-9]{2}"
    timeout: 10000

- tapOn:
    id: "sample_nav_token"
- tapOn: "SIMULATED SCAN"
- tapOn: "Binds details"
- tapOn:
    id: "sample_token_simulate"
- extendedWaitUntil:
    visible:
      id: "sample_session_card"
    timeout: 10000
# Not a bottom-row card: the nav bar floats over that row.
- tapOn:
    id: "sample_product_card_documentVerification"
- extendedWaitUntil:
    visible:
      id: "si_consent_screen"
    timeout: 30000
- assertNotVisible:
    id: "sample_user_details_screen"
- back
- extendedWaitUntil:
    visible:
      id: "sample_products_screen"
    timeout: 30000

- tapOn:
    id: "sample_nav_token"
- tapOn: "SIMULATED SCAN"
- tapOn: "Binds details"
- tapOn: "Binds consent"
- tapOn:
    id: "sample_token_simulate"
- extendedWaitUntil:
    visible:
      id: "sample_session_card"
    timeout: 10000
# Scrolled to the end: the card under the floating bar still counts as visible.
- scroll
- tapOn:
    id: "sample_product_card_enhancedKyc"
- extendedWaitUntil:
    visible:
      id: "si_processing_screen"
    timeout: 30000
- assertNotVisible:
    id: "si_consent_screen"
- extendedWaitUntil:
    visible: "Exit"
    timeout: 30000
- tapOn: "Exit"
- extendedWaitUntil:
    visible:
      id: "sample_products_screen"
    timeout: 30000

- tapOn:
    id: "sample_nav_token"
- tapOn: "SIMULATED SCAN"
- tapOn: "Expired"
- tapOn:
    id: "sample_token_simulate"
- extendedWaitUntil:
    visible:
      id: "sample_session_ended_banner"
    timeout: 10000

- stopApp
- openLink: "usesmileid-sample-expo:///flow/enhancedKyc/run"
- extendedWaitUntil:
    visible:
      id: "sample_scan_token_screen"
    timeout: 60000
- assertVisible: "Token session ended. Scan to continue where you left off."

- tapOn: "SIMULATED SCAN"
- tapOn: "Binds details"
- tapOn: "Binds consent"
- tapOn:
    id: "sample_token_simulate"
- extendedWaitUntil:
    visible:
      id: "si_processing_screen"
    timeout: 30000

# Leaves a live session, so the next flow is not sent to the scanner.
- extendedWaitUntil:
    visible: "Exit"
    timeout: 30000
- tapOn: "Exit"
- extendedWaitUntil:
    visible:
      id: "sample_products_screen"
    timeout: 30000
- assertVisible:
    id: "sample_session_card"
