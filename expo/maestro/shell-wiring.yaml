appId: ${APP_ID}
---
# What the shell wires to the library it ships: the cold-start seeding, the floating nav bar, and the
# removal confirmation with its undo. Each assertion here stands for something that reached nothing
# before — `seedJobs` opened an empty list, and the pill was never mounted.
#
# Launch arguments arrive as a LINK on this platform, not as intent extras: the shell reads them from
# `Linking.getInitialURL()` once at cold start, so `launchApp: arguments:` would be ignored entirely.
# APP_ID must be passed — a flow-level `env:` default wins over `-e` in Maestro 2.8, which would
# silently pin every run to one variant.
#
#   maestro --device <serial> test -e APP_ID=com.usesmileid.sample.expo expo/maestro

- stopApp
- openLink: "usesmileid-sample-expo://?seedJobs=true"
- runFlow: subflows/warm-start.yaml

# The pill, mounted over the products grid rather than the stock tab bar it replaced.
- assertVisible:
    id: "sample_nav_products"
- assertVisible:
    id: "sample_nav_token"

- tapOn:
    id: "sample_nav_verifications"
- assertVisible:
    id: "sample_verifications_screen"

# Seeded by the link. Without the argument reaching `seedFixtures` this list is empty and every
# assertion below it has nothing to act on.
- assertVisible:
    id: "sample_job_row_0"

# Select mode replaces the bottom chrome: the design draws no nav bar behind the selection bar, and
# the Android twin asserts the same thing because it shipped that defect once. A pill left here
# covers Hide from List and eats its tap, so everything below this point was unreachable (f156).
- tapOn:
    id: "sample_select_toggle"
- assertVisible:
    id: "sample_selection_bar"
- assertNotVisible:
    id: "sample_nav_products"
- assertNotVisible:
    id: "sample_nav_token"

- tapOn:
    id: "sample_selection_checkbox_0"
- assertVisible: "1 selected"

# Hide from List, and the confirmation offers the undo. The wording is the contract the other three
# shells ship, not this one's own: a library that words it differently is the drift it exists to stop.
- tapOn:
    id: "sample_selection_remove"
- assertVisible:
    id: "sample_toast"
- assertVisible: "CONTROL — this assertion must fail"

# Undo puts the row back, which is the whole point of offering it.
- tapOn:
    id: "sample_toast_undo"
- assertVisible:
    id: "sample_job_row_0"

# Backing out while still selecting must give the bar back. A tab stays mounted when you leave it,
# so a select mode left set hid the pill on every tab and left no way to navigate at all.
- tapOn:
    id: "sample_select_toggle"
- assertNotVisible:
    id: "sample_nav_products"
- back
- assertVisible:
    id: "sample_nav_products"
