# A profile is who a job runs as: the first run's typing becomes one, it survives a restart and fills
# the next form, a new one is made and used from the form, and sign-out asks before deleting them all.
# Flutter merges a row's texts into one label, so text is matched by id with a DOTALL regex, and it
# exposes no field value at all: a filled form is proved by the save switch staying hidden.
# Opens and closes signed out, because this is the one flow that stores a profile on purpose.
# APP_ID has no default: in Maestro 2.8 a flow-level `env:` default wins over `-e`.
appId: ${APP_ID}
---
# `clearState` works on the CI emulator; the sign-out after it is what cleans a phone that refuses it.
- runFlow:
    file: subflows/cold-start.yaml
    env:
      LINK: "usesmileid-sample-flutter://?noticeWindow=60"
      LANDS_ON: "sample_products_screen"
- runFlow: subflows/sign-out.yaml

# --- first run: no profile, and the form offers to make one -------------------------------------
- tapOn:
    id: "sample_product_card_smartSelfieEnrollment"
- assertVisible:
    id: "sample_user_details_screen"
- assertVisible:
    id: "sample_user_details_profile"
    text: "(?s).*No profile yet.*"
- tapOn:
    id: "sample_user_details_field_organisation"
- inputText: "Kobo"
- tapOn:
    id: "sample_user_details_field_firstName"
- inputText: "Ada"
- tapOn:
    id: "sample_user_details_field_lastName"
- inputText: "Okafor"
- tapOn:
    id: "sample_user_details_field_email"
- inputText: "ada@kobo.example"
- hideKeyboard
- assertVisible: "(?s).*Save as a new profile.*"
- assertVisible:
    id: "sample_remember_details_switch"
    checked: true
- tapOn:
    id: "sample_user_details_continue"
# The SDK's consent screen, by its own text: the Flutter SDK publishes no `si_consent_screen`.
- extendedWaitUntil:
    visible: "Deny"
    timeout: 30000
- tapOn: "Deny"
- extendedWaitUntil:
    visible:
      id: "sample_products_screen"
    timeout: 30000

# --- restart: the profile is stored, and the next run fills from it ------------------------------
- runFlow:
    file: subflows/cold-start.yaml
    env:
      LINK: "usesmileid-sample-flutter://?noticeWindow=60"
      LANDS_ON: "sample_products_screen"
- tapOn:
    id: "sample_product_card_smartSelfieEnrollment"
- assertVisible:
    id: "sample_user_details_profile"
- assertVisible:
    id: "sample_user_details_profile"
    text: "(?s).*Kobo.*"
# Nothing typed differs from the profile, so there is nothing to keep and no switch.
- assertNotVisible:
    id: "sample_remember_details_switch"

# --- a second persona, made and used from the form -----------------------------------------------
- tapOn:
    id: "sample_user_details_profile"
- assertVisible:
    id: "sample_profile_switch_sheet"
- tapOn:
    id: "sample_profile_switch_new"
- assertVisible:
    id: "sample_new_profile_sheet"
- tapOn:
    id: "sample_new_profile_name"
- inputText: "Kazi"
- hideKeyboard
# The sheet starts from what the form had typed, so the names are replaced rather than appended to.
- tapOn:
    id: "sample_new_profile_first_name"
- eraseText
- inputText: "Amina"
- hideKeyboard
- tapOn:
    id: "sample_new_profile_last_name"
- eraseText
- inputText: "Diallo"
- hideKeyboard
- tapOn:
    id: "sample_new_profile_save"
- assertVisible:
    id: "sample_user_details_screen"
- assertVisible:
    id: "sample_user_details_profile"
    text: "(?s).*Kazi.*"
- assertNotVisible:
    id: "sample_remember_details_switch"
- back

# --- edit the active profile from its own page --------------------------------------------------
- tapOn:
    id: "sample_nav_settings"
- tapOn:
    id: "sample_profile_summary"
- assertVisible:
    id: "sample_profiles_screen"
- tapOn:
    id: "sample_profile_row_p-2"
- assertVisible:
    id: "sample_profile_config_save"
    text: "(?s).*Save changes.*"
- tapOn:
    id: "sample_profile_config_field_phone"
- inputText: "+254700000001"
- hideKeyboard
- tapOn:
    id: "sample_profile_config_save"
- assertVisible:
    id: "sample_profiles_screen"
- back

# --- sign out asks, then leaves no profile --------------------------------------------------------
- runFlow: subflows/sign-out.yaml
- tapOn:
    id: "sample_product_card_smartSelfieEnrollment"
- assertVisible:
    id: "sample_user_details_profile"
    text: "(?s).*No profile yet.*"
