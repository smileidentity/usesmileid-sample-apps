appId: ${APP_ID}
---
# The launch-argument plumbing, which no hostless test reaches: every widget test overrides the
# launch-args provider directly, so `seedJobs` stayed wired to nothing while they all passed
# (PR #101). Only a real launch proves the argument travels.
#
# Arguments arrive as a cold-start LINK here, and `am start --ez seedJobs true` does nothing — see
# ../README.md "Traps". APP_ID must be passed, for the reason recorded there too.

- clearState
- runFlow:
    file: subflows/cold-start.yaml
    env:
      LINK: "usesmileid-sample-flutter://"
      LANDS_ON: "sample_products_screen"

# A launch with no arguments shows a partner nothing that is not theirs.
- tapOn:
    id: "sample_nav_verifications"
- assertVisible:
    id: "sample_verifications_empty"

- runFlow:
    file: subflows/cold-start.yaml
    env:
      LINK: "usesmileid-sample-flutter://?seedJobs=true"
      LANDS_ON: "sample_products_screen"
- tapOn:
    id: "sample_nav_verifications"
- assertVisible:
    id: "sample_job_row_0"

# A non-boolean name, so the lane covers the parser rather than one boolean: the drawer writes the
# same state the argument seeds, and the selected row is what reports which scenario is live. Seven
# of the ten canonical names reached nothing until the shell read the whole table.
- runFlow:
    file: subflows/cold-start.yaml
    env:
      LINK: "usesmileid-sample-flutter://debug/scenarios?scenario=expiredToken"
      LANDS_ON: "sample_scenario_drawer"
- assertVisible:
    id: "sample_scenario_item_expiredToken"
    selected: true
- assertVisible:
    id: "sample_scenario_item_normal"
    selected: false
