# The shell's identity as data; XcodeGen turns it into the project ios/verify.sh builds.
name: UseSmileIDSample
options:
  bundleIdPrefix: com.usesmileid.sample
  deploymentTarget:
    # Follows the library's floor, which SwiftData sets — see docs/plan/offline-storage.md D1.
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SampleUI:
    path: ../SampleUI
  # The registry, never a path, and the exact version SampleUI/Package.swift pins — SwiftPM unifies
  # the two on package identity, so a drift here fails resolution instead of building two SDKs.
  UseSmileID:
    url: https://github.com/smileidentity/ios-spm.git
    exactVersion: 12.1.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  UseSmileIDSample:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: SampleUI
        product: SampleUI
      # The shell hosts the flow, so the SDK is its dependency too; the analyzers are separate
      # products, and a capture screen with no analyzer registered fails at the shutter.
      - package: UseSmileID
        product: UseSmileID
      - package: UseSmileID
        product: UseSmileIDVisionFace
      - package: UseSmileID
        product: UseSmileIDVisionDocument
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.usesmileid.sample.ios
        INFOPLIST_FILE: Info.plist
        # Ad hoc, needing no certificate: an unsigned process has no keychain (SecItemAdd -34018).
        CODE_SIGN_IDENTITY: "-"
        # A phone refuses an ad-hoc binary, so the device SDK signs for real. No team is committed —
        # pass DEVELOPMENT_TEAM on the xcodebuild line, or every other developer inherits this one.
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
        "CODE_SIGN_STYLE[sdk=iphoneos*]": Automatic
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: UseSmileID Sample
        UILaunchScreen: {}
        # The SDK opens the camera; without this the first capture kills the app rather than prompting.
        NSCameraUsageDescription: Smile ID uses the camera to capture your selfie and documents.
        CFBundleURLTypes:
          - CFBundleURLName: com.usesmileid.sample.ios
            CFBundleURLSchemes: [usesmileid-sample-ios]

  UseSmileIDSampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: UseSmileIDSample
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        # The runner installs as its own app, so it needs the same device identity as the host.
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
        "CODE_SIGN_STYLE[sdk=iphoneos*]": Automatic
        GENERATE_INFOPLIST_FILE: YES
        # Only the runner's floor. `XCUISystem.open` is how a custom-scheme link is delivered
        # without the system prompt that swallows `simctl openurl`, and it needs 16.4.
        IPHONEOS_DEPLOYMENT_TARGET: "16.4"

  UseSmileIDSampleTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: UseSmileIDSample
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  UseSmileIDSampleUITests:
    build:
      targets:
        UseSmileIDSampleUITests: [test]
    test:
      targets: [UseSmileIDSampleUITests]
