name: Publish to Play (internal)

on:
  workflow_dispatch:

concurrency:
  group: publish-play-internal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Materialise the upload keystore
        uses: timheuer/base64-to-file@v2.0.0
        with:
          fileName: upload.jks
          fileDir: ./android/app
          encodedString: ${{ secrets.UPLOAD_KEYSTORE }}

      - name: Version code
        id: version
        run: echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Bundle
        working-directory: android
        run: ./gradlew bundleRelease
        env:
          ORG_GRADLE_PROJECT_REQUIRE_UPLOAD_SIGNING: "true"
          ORG_GRADLE_PROJECT_VERSION_CODE: ${{ steps.version.outputs.code }}
          ORG_GRADLE_PROJECT_uploadKeystorePassword: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}

      - name: Upload to the internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.usesmileid.sample.android
          track: internal
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.version.outputs.code }}
          whatsNewDirectory: android/play/whatsnew
