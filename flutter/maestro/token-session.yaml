appId: ${APP_ID}
---
# The token session on a locally minted fixture token: a simulated scan links it, the countdown reads
# the token's own span, bound details skip both host forms, an expired session turns the journey back
# at the gate and says why, and relinking resumes the run it interrupted. A fixture token cannot
# prove a server accepting it, nor reading a QR off a screen; those still need a Portal token by hand.
#
# The token is never asserted on, and the scan screen's field is masked, because a failed run dumps
# the hierarchy. The consent screen is asserted by its own text, as in sdk-flow.yaml: this SDK
# publishes no `si_consent_screen`.

- clearState
- runFlow:
    file: subflows/cold-start.yaml
    env:
      LINK: "usesmileid-sample-flutter://"
      LANDS_ON: "sample_products_screen"

# The host owns a camera now, so the first permission prompt in this app is the scanner's.
- tapOn:
    id: "sample_nav_token"
- runFlow: subflows/grant-camera.yaml
- extendedWaitUntil:
    visible:
      id: "sample_scan_token_screen"
    timeout: 30000
- tapOn:
    id: "sample_token_simulate"
- extendedWaitUntil:
    visible:
      id: "sample_session_card"
    timeout: 30000
# The decoded 15m span, which a hard-coded five minutes could not produce.
- assertVisible:
    id: "sample_session_countdown"
    text: "1[45]:[0-9]{2}"

# An 8h token, which is where an m:ss countdown overflows.
- tapOn:
    id: "sample_nav_token"
- extendedWaitUntil:
    visible:
      id: "sample_scan_token_screen"
    timeout: 30000
- tapOn: "SIMULATED SCAN"
- tapOn: "8h"
- tapOn:
    id: "sample_token_simulate"
- extendedWaitUntil:
    visible:
      id: "sample_session_card"
    timeout: 30000
- assertVisible:
    id: "sample_session_countdown"
    text: "[78]:[0-9]{2}:[0-9]{2}"

# A token carrying the identity skips both host forms: the SDK's consent screen is the first thing seen.
- tapOn:
    id: "sample_nav_token"
- extendedWaitUntil:
    visible:
      id: "sample_scan_token_screen"
    timeout: 30000
- tapOn: "SIMULATED SCAN"
- tapOn: "Binds details"
- tapOn:
    id: "sample_token_simulate"
- extendedWaitUntil:
    visible:
      id: "sample_session_card"
    timeout: 30000
- tapOn:
    id: "sample_product_card_documentVerification"
- extendedWaitUntil:
    visible: "Deny"
    timeout: 30000
- assertNotVisible:
    id: "sample_user_details_screen"
- assertNotVisible:
    id: "sample_kyc_form_screen"
- back
- extendedWaitUntil:
    visible:
      id: "sample_products_screen"
    timeout: 30000

# An expired session is the one outcome no form can fix, so the gate routes to the scanner.
- tapOn:
    id: "sample_nav_token"
- extendedWaitUntil:
    visible:
      id: "sample_scan_token_screen"
    timeout: 30000
- tapOn: "SIMULATED SCAN"
- tapOn: "Expired"
- tapOn:
    id: "sample_token_simulate"
- extendedWaitUntil:
    visible:
      id: "sample_session_ended_banner"
    timeout: 30000
- tapOn:
    id: "sample_product_card_smartSelfieEnrollment"
- extendedWaitUntil:
    visible:
      id: "sample_user_details_screen"
    timeout: 30000
- tapOn:
    id: "sample_user_details_field_firstName"
- inputText: "Ada"
- tapOn:
    id: "sample_user_details_field_lastName"
- inputText: "Okafor"
- tapOn:
    id: "sample_user_details_field_email"
- inputText: "ada.okafor@example.com"
- hideKeyboard
# `hideKeyboard` is a back press on Android, which pops the form when the keyboard is already down.
- assertVisible:
    id: "sample_user_details_screen"
- tapOn:
    id: "sample_user_details_continue"
- extendedWaitUntil:
    visible:
      id: "sample_scan_token_screen"
    timeout: 30000
# The redirect has to say why it moved you, asserted on the shipped sentence.
- assertVisible: ".*Token session ended.*"

# Manual entry: a rejection carries its reason and links nothing.
- tapOn:
    id: "sample_token_manual_entry"
- inputText: "not-a-jwt"
- hideKeyboard
- assertVisible:
    id: "sample_scan_token_screen"
- tapOn: "Link token"
- assertVisible: ".*three dot-separated base64url segments.*"

# Relinking resumes the interrupted run rather than stranding the person on the product list.
- tapOn: "SIMULATED SCAN"
- tapOn: "8h"
- tapOn:
    id: "sample_token_simulate"
- extendedWaitUntil:
    visible: "Deny"
    timeout: 30000
- assertNotVisible:
    id: "sample_scan_token_screen"
- back
- extendedWaitUntil:
    visible:
      id: "sample_products_screen"
    timeout: 30000
# A live span is what makes this flow safe to leave behind on a handset where clearState is refused.
- assertVisible:
    id: "sample_session_card"

# Opening the scanner deliberately explains nothing, because nothing sent you there.
- tapOn:
    id: "sample_nav_token"
- extendedWaitUntil:
    visible:
      id: "sample_scan_token_screen"
    timeout: 30000
- assertNotVisible: ".*Token session ended.*"
- back
- extendedWaitUntil:
    visible:
      id: "sample_products_screen"
    timeout: 30000
