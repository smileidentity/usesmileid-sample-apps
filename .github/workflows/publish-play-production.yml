name: Publish to Play (production)

# A published GitHub release is the trigger, so promoting to production is a deliberate act with a
# tag behind it. Manual dispatch stays available for a re-run.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-play-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is the commit count, so a shallow clone would compute the wrong one.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Materialise the upload keystore
        uses: timheuer/base64-to-file@v1.2.4
        with:
          fileName: upload.jks
          fileDir: ./android/app
          encodedString: ${{ secrets.UPLOAD_KEYSTORE }}

      - name: Version code
        id: version
        # Identical to the internal lane by design: v11 used epoch seconds on internal and a commit
        # count on production, which makes production unpublishable once internal has run.
        run: echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Bundle
        working-directory: android
        # Passed as ORG_GRADLE_PROJECT_* rather than -P so the keystore password never appears in the
        # runner's process list.
        run: ./gradlew bundleRelease
        env:
          ORG_GRADLE_PROJECT_REQUIRE_UPLOAD_SIGNING: "true"
          ORG_GRADLE_PROJECT_VERSION_CODE: ${{ steps.version.outputs.code }}
          ORG_GRADLE_PROJECT_uploadKeystorePassword: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}

      - name: Upload to the production track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.usesmileid.sample.android
          track: production
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.version.outputs.code }}
          whatsNewDirectory: android/play/whatsnew
