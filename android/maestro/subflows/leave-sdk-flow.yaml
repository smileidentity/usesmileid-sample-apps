# Out of the SDK flow and back to Products. The SDK owns back inside its own journey (R2), so one
# press steps to its previous screen rather than exiting — and how many presses that is depends on
# which screens the step switches composed. Pressing until Products appears is the only count that is
# right for every configuration. Bounded, so a flow that cannot get out fails instead of looping.
appId: ${APP_ID}
---
- repeat:
    times: 4
    while:
      notVisible:
        id: "sample_products_screen"
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 3000
- assertVisible:
    id: "sample_products_screen"
