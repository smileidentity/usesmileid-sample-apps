# Document Verification on the fixture's Green Book with its preset, from Products to the capture screen.
# Portrait on purpose: a landscape capture leaves a phone lying flat in landscape.
appId: ${APP_ID}
---
- runFlow: link-session.yaml
- tapOn:
    id: "sample_nav_products"
- scrollUntilVisible:
    element:
      id: "sample_product_card_documentVerification"
    direction: DOWN
- tapOn:
    id: "sample_product_card_documentVerification"
- scrollUntilVisible:
    element:
      id: "sample_user_details_continue"
    direction: DOWN
- tapOn:
    id: "sample_user_details_continue"
- tapOn:
    id: "sample_country_trigger"
- tapOn:
    id: "sample_country_option_ZA"
- tapOn:
    id: "sample_document_trigger"
- tapOn:
    id: "sample_document_option_IDENTITY_CARD_green_book"
- tapOn:
    id: "sample_capture_as_trigger"
- tapOn:
    id: "sample_capture_as_option_greenBook"
- scrollUntilVisible:
    element:
      id: "sample_kyc_continue"
    direction: DOWN
- tapOn:
    id: "sample_kyc_continue"
- scrollUntilVisible:
    element: "Allow"
    direction: DOWN
- tapOn: "Allow"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        id: "com.android.permissioncontroller:id/permission_allow_foreground_only_button"
    commands:
      - tapOn:
          id: "com.android.permissioncontroller:id/permission_allow_foreground_only_button"
- assertVisible:
    id: "si_instructions_screen"
- scrollUntilVisible:
    element: "Next"
    direction: DOWN
- tapOn: "Next"
- extendedWaitUntil:
    visible:
      id: "si_capture_screen"
    timeout: 10000
