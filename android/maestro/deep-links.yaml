# Every route opens COLD, on the right destination, with its arguments parsed. Warm start passes
# by accident. APP_ID must be passed — see shell-navigation.yaml for why it has no default.
appId: ${APP_ID}
---
- stopApp
- openLink: "usesmileid-sample-android://products"
- extendedWaitUntil:
    visible:
      id: "sample_products_screen"
    timeout: 120000

- stopApp
- openLink: "usesmileid-sample-android://verifications"
- assertVisible:
    id: "sample_verifications_screen"

- stopApp
- openLink: "usesmileid-sample-android://settings"
- assertVisible:
    id: "sample_settings_screen"

- stopApp
- openLink: "usesmileid-sample-android://verifications/job-7"
- assertVisible:
    id: "sample_verification_details_screen"
- assertVisible: ".*jobId = job-7.*"

- stopApp
- openLink: "usesmileid-sample-android://flow/biometricKyc/details"
- assertVisible:
    id: "sample_user_details_screen"
# The screen resolves the id to its product, so its label is what proves the argument parsed.
- assertVisible: "Biometric KYC"

- stopApp
- openLink: "usesmileid-sample-android://flow/biometricKyc/id-details"
- assertVisible:
    id: "sample_kyc_form_screen"

- stopApp
- openLink: "usesmileid-sample-android://flow/biometricKyc/id-details/country"
- assertVisible:
    id: "sample_country_sheet"

- stopApp
- openLink: "usesmileid-sample-android://flow/biometricKyc/id-details/id-type"
- assertVisible:
    id: "sample_idtype_sheet"

# One route, two presentations, and the SDK's own pre-flight runs on entry.
- stopApp
- openLink: "usesmileid-sample-android://flow/docV/run"
- assertVisible: ".*route = fullscreen.*"
- assertVisible: ".*pre-flight:.*"

- stopApp
- openLink: "usesmileid-sample-android://flow/docV/run?route=shell"
- assertVisible: ".*route = shell.*"

- stopApp
- openLink: "usesmileid-sample-android://profiles"
- assertVisible:
    id: "sample_profiles_screen"

# /profiles/switch and /profiles/new must not be swallowed as a profile id.
- stopApp
- openLink: "usesmileid-sample-android://profiles/switch"
- assertVisible:
    id: "sample_profile_switch_sheet"

- stopApp
- openLink: "usesmileid-sample-android://profiles/new"
- assertVisible:
    id: "sample_new_profile_sheet"

- stopApp
- openLink: "usesmileid-sample-android://profiles/p-1"
- assertVisible:
    id: "sample_profile_config_screen"
# The screen resolves the id to its profile, so the organisation is what proves the argument parsed.
- assertVisible: "UpTech Finance"

- stopApp
- openLink: "usesmileid-sample-android://token/scan"
- assertVisible:
    id: "sample_scan_token_screen"

- stopApp
- openLink: "usesmileid-sample-android://debug/scenarios"
- assertVisible:
    id: "sample_scenario_drawer"
