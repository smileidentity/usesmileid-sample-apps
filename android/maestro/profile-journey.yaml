# APP_ID must be passed — see shell-navigation.yaml for why it has no default.
appId: ${APP_ID}
---
- stopApp
- launchApp
- runFlow: subflows/warm-start.yaml
- runFlow: subflows/sign-out.yaml

- tapOn:
    id: "sample_product_card_smartSelfieEnrollment"
- assertVisible:
    id: "sample_user_details_screen"
- assertVisible: "No profile yet"
- tapOn:
    id: "sample_user_details_field_organisation"
- inputText: "Kobo"
- tapOn:
    id: "sample_user_details_field_firstName"
- inputText: "Ada"
- tapOn:
    id: "sample_user_details_field_lastName"
- inputText: "Okafor"
- tapOn:
    id: "sample_user_details_field_email"
- inputText: "ada@kobo.example"
- hideKeyboard
- assertVisible: "Save as a new profile"
- assertVisible:
    id: "sample_remember_details_switch"
    checked: true
- tapOn:
    id: "sample_user_details_continue"
- assertVisible:
    id: "si_consent_screen"
- tapOn: "Deny"
- assertVisible:
    id: "sample_verification_details_screen"
- back

- stopApp
- launchApp
- runFlow: subflows/warm-start.yaml
- tapOn:
    id: "sample_product_card_smartSelfieEnrollment"
- assertVisible:
    id: "sample_user_details_profile"
- assertVisible: "Kobo"
- assertVisible:
    id: "sample_user_details_field_firstName"
    text: "Ada"
- assertNotVisible:
    id: "sample_remember_details_switch"

- tapOn:
    id: "sample_user_details_profile"
- assertVisible:
    id: "sample_profile_switch_sheet"
- tapOn:
    id: "sample_profile_switch_new"
- assertVisible:
    id: "sample_new_profile_sheet"
- tapOn:
    id: "sample_new_profile_name"
- inputText: "Kazi"
- assertVisible:
    id: "sample_new_profile_first_name"
    text: "Ada"
- tapOn:
    id: "sample_new_profile_first_name"
- eraseText
- inputText: "Amina"
- tapOn:
    id: "sample_new_profile_last_name"
- eraseText
- inputText: "Diallo"
- hideKeyboard
- tapOn:
    id: "sample_new_profile_save"
- assertVisible:
    id: "sample_user_details_screen"
- assertVisible: "Kazi"
- assertVisible:
    id: "sample_user_details_field_firstName"
    text: "Amina"
- back

- tapOn:
    id: "sample_nav_settings"
- tapOn:
    id: "sample_profile_summary"
- assertVisible:
    id: "sample_profiles_screen"
- tapOn:
    id: "sample_profile_row_p-2"
- assertVisible: "Save changes"
- tapOn:
    id: "sample_profile_config_field_phone"
- inputText: "+254700000001"
- hideKeyboard
- tapOn:
    id: "sample_profile_config_save"
- assertVisible:
    id: "sample_profiles_screen"
- tapOn:
    id: "sample_profile_row_p-2"
- assertVisible:
    id: "sample_profile_config_save"
    enabled: false
- back
- assertVisible:
    id: "sample_profiles_screen"
- back

- runFlow: subflows/sign-out.yaml
- tapOn:
    id: "sample_product_card_smartSelfieEnrollment"
- assertVisible: "No profile yet"
