name: Flutter device

# Ubuntu, not the macOS runner `flutter.yml` needs for host-rasterised goldens: a Mac has no KVM.
# Nothing here rasterises anything — it drives a running app, which is the only place the
# launch-argument plumbing and the bundled licence registry can be seen at all.
on:
  pull_request:
    paths:
      - 'flutter/**'
      - 'spec/**'
      - '.github/workflows/flutter-device.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-device-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The build fills this runner and the emulator package then has nowhere to land. The Android
      # SDK and NDK are deliberately untouched: the Flutter build needs both.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/share/swift \
            /usr/local/share/powershell /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # The pin flutter.yml carries: it decides which engine components the bundle carries,
          # and licenses.yaml names two of them by id.
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v6

      # One ABI for the engine and AOT snapshot, the part that is compiled: the emulator is x86_64
      # and building all four is what killed the Expo runner mid-compile.
      #
      # Release, so a shrink that breaks the app fails here. Not consumption evidence yet — no Dart
      # file imports `usesmileid`, so nothing in this APK calls the SDK (see the lane README).
      - name: Build the release APK
        run: flutter build apk --release --target-platform android-x64
        working-directory: flutter/app

      # The daemon holds a heap this runner needs back before an emulator will fit beside it.
      - name: Stop the Gradle daemon
        run: ./gradlew --stop
        working-directory: flutter/app/android

      - name: Report the disk left for the emulator
        run: df -h / | tail -1

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The emulator needs nested virtualisation, which is not granted to the runner user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the device flows
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # Each line runs as its own `sh -c`, so no variable carries between them and dash has no
          # `SECONDS`; Maestro's own total, against the step duration, is what times the emulator.
          # A lock or a system ANR dialog reds every flow as the app's fault; an app crash still lands in logs/crash-report.txt.
          # The first launch after install compiles the release APK and stalls this two-core emulator long
          # enough for adb to drop it, which Maestro never recovers from; one launch before the suite takes that.
          script: |
            nohup adb logcat -v threadtime > "$RUNNER_TEMP/logcat.txt" 2>&1 &
            adb shell locksettings set-disabled true
            adb shell settings put global hide_error_dialogs 1
            adb install -r flutter/app/build/app/outputs/flutter-apk/app-release.apk
            adb shell am start -a android.intent.action.VIEW -d "usesmileid-sample-flutter://"
            sleep 90
            adb shell am force-stop com.usesmileid.sample.flutter
            maestro test -e APP_ID=com.usesmileid.sample.flutter flutter/maestro

      # A device that drops off leaves Maestro nothing to write, so the logcat and the host's view travel too.
      - name: Collect what the host saw of the emulator
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          sudo dmesg | tail -80 > "$RUNNER_TEMP/diag/dmesg.txt" || true
          sudo journalctl --no-pager --since "-40 min" | grep -iE 'oom|killed|qemu|emulator' | tail -60 > "$RUNNER_TEMP/diag/journal.txt" || true
          systemctl is-active systemd-oomd > "$RUNNER_TEMP/diag/oomd.txt" 2>&1 || true
          free -m > "$RUNNER_TEMP/diag/free.txt"
          cp -r /tmp/android-runner "$RUNNER_TEMP/diag/" 2>/dev/null || true
          cp "$RUNNER_TEMP/logcat.txt" "$RUNNER_TEMP/diag/" 2>/dev/null || true

      - name: Upload the host diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-device-host
          path: ${{ runner.temp }}/diag/**
          if-no-files-found: ignore
          retention-days: 7

      # A red here is a screen recording and a hierarchy, which is what makes it readable at all.
      - name: Upload the Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-device-debug
          path: ~/.maestro/tests/**
          if-no-files-found: ignore
          retention-days: 7
