# The SDK flow handoff: mount, then exactly one terminal result on both exits this repo can drive —
# Deny and the back gesture — including immediate re-entry. Card assertions read the
# verification-details card, because the products line renders only while a run is in flight.
# Flows stop at the capture screen (docs/plan/sample-apps-plan.md §6).
# APP_ID must be passed — see shell-navigation.yaml for why it has no default.
appId: ${APP_ID}
---
# Rows are a precondition, not the subject: the app seeds none. Seeded once — they persist in Room.
- stopApp
- launchApp:
    arguments:
      probes: true
      seedJobs: true
- runFlow: subflows/warm-start.yaml

# The SDK's consent screen appearing is what a packaging failure fails on, conclusively.
- tapOn:
    id: "sample_product_card_smartSelfieEnrollment"
- assertVisible:
    id: "sample_user_details_screen"
- tapOn:
    id: "sample_user_details_field_firstName"
- inputText: "Ada"
- tapOn:
    id: "sample_user_details_field_lastName"
- inputText: "Okafor"
# The SDK requires a contact field even though the form labels both optional.
- tapOn:
    id: "sample_user_details_field_email"
- inputText: "ada.okafor@example.com"
- hideKeyboard
- tapOn:
    id: "sample_user_details_continue"
- assertVisible:
    id: "si_consent_screen"

# Deny delivers a typed Failure, not a cancel, and replaces the wizard with details (R4).
- tapOn: "Deny"
- assertVisible:
    id: "sample_verification_details_screen"
- assertVisible:
    id: "sample_result_job_status"
    text: "failed"
- assertVisible:
    id: "sample_result_result_count"
    text: "1"
- assertVisible:
    id: "sample_result_last_error"
    text: "User denied consent"
# Back from the landing route goes to the originating tab — never back into the flow (R4).
- back
- assertVisible:
    id: "sample_products_screen"

# Continue tapped three times fast must start one run, not three. The form keeps its values
# because the stores survive the wizard being replaced (R6).
- tapOn:
    id: "sample_product_card_smartSelfieEnrollment"
- assertVisible:
    id: "sample_user_details_screen"
- tapOn:
    id: "sample_user_details_continue"
    repeat: 3
    delay: 60
- assertVisible:
    id: "si_consent_screen"
- tapOn: "Deny"
- assertVisible:
    id: "sample_verification_details_screen"
- assertVisible:
    id: "sample_result_result_count"
    text: "1"
- back
- assertVisible:
    id: "sample_products_screen"

# The back gesture is the Cancelled path. The SDK consumes it even on its first screen, so the
# host returns to the originating tab rather than the form beneath (§7.2).
- tapOn:
    id: "sample_product_card_smartSelfieEnrollment"
- assertVisible:
    id: "sample_user_details_screen"
- tapOn:
    id: "sample_user_details_continue"
- assertVisible:
    id: "si_consent_screen"
- back
- assertVisible:
    id: "sample_products_screen"
- tapOn:
    id: "sample_nav_verifications"
- assertVisible:
    id: "sample_verifications_screen"
- tapOn:
    id: "sample_job_row_0"
- assertVisible:
    id: "sample_result_job_status"
    text: "cancelled"
- assertVisible:
    id: "sample_result_result_count"
    text: "1"
- back
- assertVisible:
    id: "sample_verifications_screen"
- tapOn:
    id: "sample_nav_products"
- assertVisible:
    id: "sample_products_screen"

# The in-shell presentation (R3), reached by TAPPING under `route: shell`: a deep link or autostart
# carrying the argument is effectively a cold start (R9), so the gate would turn it back.
- stopApp
- launchApp:
    arguments:
      probes: true
      route: shell
- runFlow: subflows/warm-start.yaml
- tapOn:
    id: "sample_product_card_smartSelfieEnrollment"
- assertVisible:
    id: "sample_user_details_screen"
- tapOn:
    id: "sample_user_details_field_firstName"
- inputText: "Ada"
- tapOn:
    id: "sample_user_details_field_lastName"
- inputText: "Okafor"
- tapOn:
    id: "sample_user_details_field_email"
- inputText: "ada.okafor@example.com"
- hideKeyboard
- tapOn:
    id: "sample_user_details_continue"
- assertVisible:
    id: "si_consent_screen"
# The flow is not a tab root, so the host's nav bar must not draw over the SDK (R13).
- assertNotVisible:
    id: "sample_nav_products"
- tapOn: "Deny"
- assertVisible:
    id: "sample_verification_details_screen"
- assertVisible:
    id: "sample_result_route"
    text: "shell"
- assertVisible:
    id: "sample_result_result_count"
    text: "1"

# Allow continues into the SDK's own navigation. The details are re-entered because this section
# relaunches, and the forms survive recreation but not process death.
- stopApp
- launchApp:
    arguments:
      probes: true
- runFlow: subflows/warm-start.yaml
- tapOn:
    id: "sample_product_card_smartSelfieEnrollment"
- assertVisible:
    id: "sample_user_details_screen"
- tapOn:
    id: "sample_user_details_field_firstName"
- inputText: "Ada"
- tapOn:
    id: "sample_user_details_field_lastName"
- inputText: "Okafor"
- tapOn:
    id: "sample_user_details_field_email"
- inputText: "ada.okafor@example.com"
- hideKeyboard
- tapOn:
    id: "sample_user_details_continue"
- assertVisible:
    id: "si_consent_screen"
- assertNotVisible:
    id: "sample_nav_products"
- tapOn: "Allow"
# The SDK asks for camera permission on the way out of consent. Conditional because the grant
# outlives the install, so an unconditional tap passes once then fails every re-run. ColorOS
# refuses `pm grant`, so it is answered on screen rather than pre-granted.
- runFlow:
    when:
      visible:
        id: "com.android.permissioncontroller:id/permission_allow_foreground_only_button"
    commands:
      - tapOn:
          id: "com.android.permissioncontroller:id/permission_allow_foreground_only_button"
- assertVisible:
    id: "si_instructions_screen"
- stopApp
