[versions]
# The SDK snapshot builds made against njia's pinned build; a bare -SNAPSHOT can resolve a build made against another njia.
usesmileid = "12.3.0-20261026.002955-291"
usesmileid-bom = "12.3.0-20261026.002955-292"
usesmileid-mlkit-face = "12.3.0-20261026.002955-288"
usesmileid-mlkit-document = "12.3.0-20261026.002955-289"
usesmileid-huawei-face = "12.3.0-20261026.002955-289"
usesmileid-huawei-document = "12.3.0-20261026.002955-290"
usesmileid-bridge = "12.3.0-20261026.002955-290"
# The four apps' navigation engine: one snapshot build, pinned, until its first release; the SDK's older build would win as a bare -SNAPSHOT.
njia = "0.0.1-20261025.232953-11"

android-gradle-plugin = "9.3.1"
kotlin = "2.4.21"
ksp = "2.3.12"

androidx-activity = "1.13.0"
# Custom Tabs for the Settings links: the page keeps the user's own browser rather than a WebView.
androidx-browser = "1.9.0"
androidx-compose-bom = "2026.06.01"
androidx-core = "1.16.0"
androidx-datastore = "1.2.1"
androidx-room = "2.8.4"
# Debug builds only: the in-app network log, the Android twin of the iOS app's Loupe.
chucker = "4.3.1"
# Pinned to what the SDK resolves at runtime; a divergence is a finding, never something Gradle reconciles in silence.
camerax = "1.6.1"
# The bundled model, never the play-services variant: the sample must run on GMS-free devices.
mlkit-barcode = "17.3.0"
# Pinned to the SDK's own client version so the APK carries one Retrofit and one OkHttp.
retrofit = "3.0.0"
kotlinx-serialization = "1.11.0"

junit = "4.13.2"
kotlinx-coroutines = "1.11.0"
robolectric = "4.17"
roborazzi = "1.76.0"

[libraries]
njia = { module = "com.usesmileid:njia", version.ref = "njia" }
njia-compose = { module = "com.usesmileid:njia-compose", version.ref = "njia" }
usesmileid-bom = { module = "com.usesmileid:usesmileid-bom", version.ref = "usesmileid-bom" }
usesmileid = { module = "com.usesmileid:usesmileid", version.ref = "usesmileid" }
usesmileid-mlkit-face = { module = "com.usesmileid:mlkit-face", version.ref = "usesmileid-mlkit-face" }
usesmileid-mlkit-document = { module = "com.usesmileid:mlkit-document", version.ref = "usesmileid-mlkit-document" }
usesmileid-huawei-face = { module = "com.usesmileid:huawei-face", version.ref = "usesmileid-huawei-face" }
usesmileid-huawei-document = { module = "com.usesmileid:huawei-document", version.ref = "usesmileid-huawei-document" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidx-room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidx-room" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
chucker = { module = "com.github.chuckerteam.chucker:library", version.ref = "chucker" }

androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-compose = { module = "androidx.camera:camera-compose", version.ref = "camerax" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkit-barcode" }


junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
