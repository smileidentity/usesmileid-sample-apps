# Links a fifteen-minute simulated session unless one is live: every run needs a token before its first step.
appId: ${APP_ID}
---
- runFlow:
    when:
      notVisible:
        id: "sample_session_card"
    commands:
      - tapOn:
          id: "sample_nav_token"
      # The host's own camera prompt comes before the SDK's.
      - runFlow:
          when:
            visible:
              id: "com.android.permissioncontroller:id/permission_allow_foreground_only_button"
          commands:
            - tapOn:
                id: "com.android.permissioncontroller:id/permission_allow_foreground_only_button"
      - assertVisible:
          id: "sample_scan_token_screen"
      - tapOn:
          id: "sample_token_simulate"
      - extendedWaitUntil:
          visible:
            id: "sample_session_card"
          timeout: 10000
