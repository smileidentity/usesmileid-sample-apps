# Every canonical launch argument is accepted at cold start and reported on the result card. Runs
# assert on the card rather than on the argument they passed, because those are different claims:
# one says what was asked for, the other says what the app actually got.
#
# This flow taps its way to the card and never deep-links to it. A deep link delivered by `am start`
# carries FLAG_ACTIVITY_NEW_TASK and rebuilds the Activity, which discards the launch arguments along
# with every other in-memory hoist — see R9 in docs/plan/navigation-plan.md. Deep-linking here would
# read defaults and look like a parsing bug.
#
# The screen assertions between taps are synchronisation, not decoration: Maestro will happily tap
# through a sheet-dismiss animation and report the tap complete, and the flow then fails several
# steps later on a screen that never changed.
# APP_ID must be passed — see shell-navigation.yaml for why it has no default.
appId: ${APP_ID}
---
- stopApp
# Rows are a precondition, not the subject: the app seeds none. Seeded once — they persist in Room.
- launchApp:
    arguments:
      scenario: expiredToken
      theme: clashingHost
      route: shell
      seedJobs: true
- runFlow: subflows/warm-start.yaml
- tapOn:
    id: "sample_nav_verifications"
- assertVisible:
    id: "sample_verifications_screen"
- tapOn:
    id: "sample_job_row_0"
- assertVisible:
    id: "sample_result_card"
- assertVisible:
    id: "sample_result_active_scenario"
    text: "expiredToken"
- assertVisible:
    id: "sample_result_active_theme"
    text: "clashingHost"

# Every schema field reaches the tree, including the ones with nothing in them yet: an id that is
# missing and one that is empty are different failures, and only the card can tell them apart.
- assertVisible:
    id: "sample_result_job_status"
    text: "idle"
- assertVisible:
    id: "sample_result_result_count"
    text: "0"
- assertVisible:
    id: "sample_result_refresh_count"
    text: "0"
- assertVisible:
    id: "sample_result_job_id"
    text: "—"
# The last row sits below the fold on a 6.4" screen, so it is scrolled to rather than assumed visible.
# Null until the SDK publishes a runtime accessor — see sdkVersion.blocked in result-card.schema.json.
- scrollUntilVisible:
    element:
      id: "sample_result_sdk_version"
    direction: DOWN
    visibilityPercentage: 50
- assertVisible:
    id: "sample_result_sdk_version"
    text: "—"

# An unrecognised value falls back to that argument's default instead of failing the launch, which
# is only safe while the card keeps reporting the fallback.
- stopApp
- launchApp:
    arguments:
      scenario: notAScenario
- tapOn:
    id: "sample_nav_verifications"
- assertVisible:
    id: "sample_verifications_screen"
- tapOn:
    id: "sample_job_row_0"
- assertVisible:
    id: "sample_result_active_scenario"
    text: "normal"

# The card renders even when the job id resolves to nothing: a flow that failed before submission
# has no job to show, and that is exactly when its counts are the only evidence there is.
- stopApp
- openLink: "usesmileid-sample-android://verifications/job-missing"
- assertVisible:
    id: "sample_result_card"

# autostart lands on the flow route under the route it was given. With empty stores the pre-flight
# redirects to that product's form (§7.3), and the card keeps the route it recorded on entry.
- stopApp
- launchApp:
    arguments:
      autostart: biometricKyc
      route: shell
- assertVisible:
    id: "sample_user_details_screen"
- assertVisible: "Biometric KYC"
- back
- assertVisible:
    id: "sample_products_screen"
- tapOn:
    id: "sample_nav_verifications"
- assertVisible:
    id: "sample_verifications_screen"
- tapOn:
    id: "sample_job_row_0"
- assertVisible:
    id: "sample_result_route"
    text: "shell"

# There is no `sandbox` argument any more: the token decides the environment, so a run picks one by
# minting rather than by argument. Both hosts are minted locally — the fixture is unsigned and no flow
# here completes a capture, so naming the production host exercises the decode and submits nothing.
#
# The run has to reach the SDK, because the card records the environment from the entry snapshot and a
# journey that never starts has none to show. Production is minted first and sandbox last: a linked
# session outlives `stopApp` (R6), so the last host minted here is what later flows inherit.
- stopApp
- launchApp:
    arguments:
      seedJobs: true
- runFlow: subflows/warm-start.yaml

- tapOn:
    id: "sample_nav_token"
- runFlow: subflows/grant-camera.yaml
- assertVisible:
    id: "sample_scan_token_screen"
- tapOn: "SIMULATED SCAN"
- tapOn: "Production"
# Both bindings, so the run reaches the SDK's instructions screen with no host form in between.
- tapOn: "Binds consent"
- tapOn: "Binds details"
- tapOn:
    id: "sample_token_simulate"
- assertVisible:
    id: "sample_session_card"
- tapOn:
    id: "sample_product_card_smartSelfieEnrollment"
- extendedWaitUntil:
    visible:
      id: "si_instructions_screen"
    timeout: 20000
- back
- assertVisible:
    id: "sample_products_screen"
- tapOn:
    id: "sample_nav_verifications"
- tapOn:
    id: "sample_job_row_0"
- assertVisible:
    id: "sample_result_environment"
    text: "production"
- back
- tapOn:
    id: "sample_nav_products"
- assertVisible:
    id: "sample_products_screen"

# The same door, the other host: only the token changed, which is what the pair exists to prove.
- tapOn:
    id: "sample_nav_token"
- assertVisible:
    id: "sample_scan_token_screen"
- tapOn: "SIMULATED SCAN"
- tapOn: "Sandbox"
- tapOn: "Binds consent"
- tapOn: "Binds details"
- tapOn:
    id: "sample_token_simulate"
- assertVisible:
    id: "sample_session_card"
- tapOn:
    id: "sample_product_card_smartSelfieEnrollment"
- extendedWaitUntil:
    visible:
      id: "si_instructions_screen"
    timeout: 20000
- back
- assertVisible:
    id: "sample_products_screen"
- tapOn:
    id: "sample_nav_verifications"
- tapOn:
    id: "sample_job_row_0"
- assertVisible:
    id: "sample_result_environment"
    text: "sandbox"
- back
- tapOn:
    id: "sample_nav_products"
- assertVisible:
    id: "sample_products_screen"

# Leave an UNBOUND 8h sandbox session behind. Unbound because a bound one removes the host's details
# form and the SDK's consent screen, which is what the next flow in a folder run asserts on; 8h because
# the default 15m ran out before that flow reached the SDK on a slow device, and an expired session is
# worse than none — it sends the next journey to the scanner.
- tapOn:
    id: "sample_nav_token"
- assertVisible:
    id: "sample_scan_token_screen"
- tapOn: "SIMULATED SCAN"
- tapOn: "8h"
- tapOn:
    id: "sample_token_simulate"
- assertVisible:
    id: "sample_products_screen"
- assertVisible:
    id: "sample_session_card"

# The drawer writes the state a launch argument seeds, so one card reports either source. Opened by
# its own deep link rather than through the Settings row, which sits below the fold behind a scroll
# this assertion has no interest in.
- stopApp
- openLink: "usesmileid-sample-android://debug/scenarios"
- assertVisible:
    id: "sample_scenario_drawer"
- tapOn:
    id: "sample_scenario_item_offlineRetry"
- back
- assertVisible:
    id: "sample_products_screen"
- tapOn:
    id: "sample_nav_verifications"
- assertVisible:
    id: "sample_verifications_screen"
- tapOn:
    id: "sample_job_row_0"
- assertVisible:
    id: "sample_result_active_scenario"
    text: "offlineRetry"
