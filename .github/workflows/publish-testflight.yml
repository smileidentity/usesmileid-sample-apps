name: Publish to TestFlight

# Dispatch only: the first upload fixes the signing identity and creates the listing, which is an
# owner action. A `push` trigger later needs a path filter, or a docs-only merge ships a build.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Override the build number; empty takes one above the highest App Store Connect holds
        required: false

concurrency:
  group: publish-ios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: blacksmith-6vcpu-macos-26
    # Store credentials are scoped to this environment, and its reviewers approve every run.
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          for candidate in /Applications/Xcode_${XCODE_VERSION}.app /Applications/Xcode.app; do
            if [ -d "$candidate" ]; then sudo xcode-select -s "$candidate"; break; fi
          done
          BUILD="$(xcodebuild -version | tail -1)"
          if [ "$BUILD" != "Build version $XCODE_BUILD" ]; then
            echo "::warning title=Xcode build drifted::The uploaded binary links against this \
            runner's SDK, and it is $BUILD rather than the pinned $XCODE_BUILD."
          fi
          xcodebuild -version
        env:
          XCODE_VERSION: "26.6"
          XCODE_BUILD: 17F113

      - name: Install XcodeGen
        run: brew install xcodegen

      # Written to the directory xcodebuild reads keys from, and removed however the run ends.
      # umask first: the default leaves the private key world-readable on the runner.
      - name: Materialise the App Store Connect API key
        run: |
          case "$KEY_ID" in
            "" | *[!A-Z0-9]*) echo "::error::APP_STORE_CONNECT_KEY_ID is not a key id"; exit 1 ;;
          esac
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}

      # One above what App Store Connect holds, across every version, so this lane and the App Store one never collide.
      - name: Build number
        id: version
        run: echo "build=${OVERRIDE:-$(python3 scripts/asc_publish.py next-build)}" >> "$GITHUB_OUTPUT"
        env:
          OVERRIDE: ${{ inputs.build_number }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      # Signing on a runner with no identity makes Xcode mint an Apple Development certificate; note what exists first.
      - name: Note the team's development certificates
        id: certs
        run: python3 scripts/asc_publish.py dev-certs > "$RUNNER_TEMP/dev-certs-before.txt"
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      # The key material never reaches xcodebuild's argv; the team and key ids do, and are masked
      # in the log and gone with the runner.
      - name: Archive and upload
        run: ios/verify.sh archive
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          EXPORT_DESTINATION: upload
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Revoke the development certificate this run minted
        if: always() && steps.certs.outcome == 'success'
        run: python3 scripts/asc_publish.py revoke-new-dev-certs --before "$RUNNER_TEMP/dev-certs-before.txt"
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Remove the API key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys
