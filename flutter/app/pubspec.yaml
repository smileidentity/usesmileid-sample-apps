name: usesmileid_sample_flutter
description: The UseSmileID Flutter sample, consuming the SDK from pub.dev exactly as a partner does.
version: 1.0.0+1

# Not a package: this is the app, and nothing here is published.
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

  # The SDK from pub.dev, pinned EXACT rather than with a caret. A bump arrives as a PR, which is
  # what makes every bump a free consumption test; a caret lets a fresh resolve move to a release
  # no PR ever exercised. Registry-only, permanently: no path dependency, no dependency_overrides.
  usesmileid: 12.1.1

  # The federated ML providers, pinned exactly for the same reason as the SDK above. A capture
  # screen with none of these registered falls back to a Pigeon call no plugin answers, so the flow
  # dies on the device; the four are what the Expo app and the SDK's own sample both carry.
  usesmileid_mlkit_face: 12.1.1
  usesmileid_mlkit_document: 12.1.1
  usesmileid_vision_face: 12.1.1
  usesmileid_vision_document: 12.1.1

  # The shared journey, by path. Never published, and the SDK repo maps the same source into its
  # own development sample.
  sample_ui:
    path: ../sample_ui

  # Chosen in docs/plan/navigation-plan.md for StatefulShellRoute's per-tab back stacks.
  go_router: ^17.5.0

  # Chosen in docs/plan/navigation-plan.md: ProviderScope overrides turn the launch arguments into
  # provider overrides at app start, so automation gets deterministic state with no test-only build.
  flutter_riverpod: ^3.1.0

  # The settings store, named in the same plan. Already in the graph transitively via the SDK.
  shared_preferences: ^2.5.3

  # The token scanner: bundled ML Kit on Android like the native app, Apple Vision on iOS.
  mobile_scanner: ^7.4.2

  # The token is a bearer credential, so it lives in the Keychain / Keystore, never beside the switches.
  flutter_secure_storage: ^11.2.0

  # The template's own. Switch.adaptive puts Cupertino widgets in the tree, and without this the
  # icon tree-shaker warns that it cannot find the family they reference.
  cupertino_icons: ^1.0.8

  # Settings' link rows: Custom Tabs / SFSafariViewController in app, the system browser for PDFs.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The published lint set, so a partner reading this app sees the rules they already have.
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
