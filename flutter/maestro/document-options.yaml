appId: ${APP_ID}
---
# The document products' form: the document list, "Capture as" and the custom sheet, through SDK
# mount. The lists come from spec/catalogue-fixture.json (`catalogue=fixture`), so nothing here
# depends on the network. The consent screen is asserted by its text: see sdk-flow.yaml.

- clearState
- runFlow:
    file: subflows/cold-start.yaml
    env:
      LINK: "usesmileid-sample-flutter://?probes=true&catalogue=fixture"
      LANDS_ON: "sample_products_screen"

- tapOn:
    id: "sample_product_card_documentVerification"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "sample_user_details_screen"
    timeout: 30000
- tapOn:
    id: "sample_user_details_field_firstName"
- eraseText
- inputText: "Ada"
- tapOn:
    id: "sample_user_details_field_lastName"
- eraseText
- inputText: "Okafor"
- tapOn:
    id: "sample_user_details_field_email"
- eraseText
- inputText: "ada.okafor@example.com"
- hideKeyboard
- runFlow: subflows/keep-nothing.yaml
- tapOn:
    id: "sample_user_details_continue"

# The document products ask for a document and how to capture it, never an ID number.
- extendedWaitUntil:
    visible:
      id: "sample_kyc_form_screen"
    timeout: 30000
- assertNotVisible:
    id: "sample_idnumber_input"
- tapOn:
    id: "sample_country_trigger"
- assertVisible:
    id: "sample_country_sheet"
- tapOn:
    id: "sample_country_option_ZA"

# The Green Book is its own row after its parent; the API's 'Others', whose code is empty, is not listed.
- tapOn:
    id: "sample_document_trigger"
- assertVisible:
    id: "sample_document_option_IDENTITY_CARD"
- assertVisible:
    id: "sample_document_option_IDENTITY_CARD_green_book"
- assertNotVisible:
    id: "sample_document_option_"
- tapOn:
    id: "sample_document_option_IDENTITY_CARD_green_book"
- assertVisible:
    text: ".*Green Book.*"
    childOf:
      id: "sample_document_trigger"

# Every choice is on offer; Automatic is the default.
- tapOn:
    id: "sample_capture_as_trigger"
- assertVisible:
    id: "sample_capture_as_sheet"
- assertVisible:
    id: "sample_capture_as_option_automatic"
    selected: true
- assertVisible:
    id: "sample_capture_as_option_greenBook"
- assertVisible:
    id: "sample_capture_as_option_passport"

# Custom opens its own sheet, and what it builds is named on the trigger.
- tapOn:
    id: "sample_capture_as_option_custom"
- assertVisible:
    id: "sample_custom_document_sheet"
- tapOn:
    id: "sample_custom_document_name"
- eraseText
- inputText: "Booklet"
- hideKeyboard
- tapOn:
    id: "sample_custom_document_orientation_portrait"
- tapOn:
    id: "sample_custom_document_aspect_ratio_booklet"
- tapOn:
    id: "sample_custom_document_done"
- assertVisible:
    text: ".*Booklet.*"
    childOf:
      id: "sample_capture_as_trigger"

# Back to Automatic, then through to the SDK: the flow host mounted with a document journey.
- tapOn:
    id: "sample_capture_as_trigger"
- tapOn:
    id: "sample_capture_as_option_automatic"
- tapOn:
    id: "sample_kyc_continue"
- extendedWaitUntil:
    visible: "Deny"
    timeout: 30000
- tapOn: "Deny"
- extendedWaitUntil:
    visible:
      id: "sample_products_screen"
    timeout: 30000

# --- the list failing -------------------------------------------------------------------------------
# `unreachable` fails every list at once: the picker says so and offers Retry, which fails again.
- runFlow:
    file: subflows/cold-start.yaml
    env:
      LINK: "usesmileid-sample-flutter://?catalogue=unreachable"
      LANDS_ON: "sample_products_screen"
- tapOn:
    id: "sample_product_card_documentVerification"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "sample_user_details_screen"
    timeout: 30000
- tapOn:
    id: "sample_user_details_continue"
- extendedWaitUntil:
    visible:
      id: "sample_kyc_form_screen"
    timeout: 30000
- tapOn:
    id: "sample_country_trigger"
- extendedWaitUntil:
    visible:
      id: "sample_catalogue_error"
    timeout: 10000
- tapOn:
    id: "sample_catalogue_retry"
- extendedWaitUntil:
    visible:
      id: "sample_catalogue_error"
    timeout: 10000

# --- the Settings side ------------------------------------------------------------------------------
- runFlow:
    file: subflows/cold-start.yaml
    env:
      LINK: "usesmileid-sample-flutter://settings/capture-mode?catalogue=fixture"
      LANDS_ON: "sample_capture_mode_sheet"
- assertVisible:
    id: "sample_capture_mode_option_autoWithFallback"
    selected: true
- tapOn:
    id: "sample_capture_mode_option_manual"
# The sheet hands back to Settings, where the row sits below the fold.
- scrollUntilVisible:
    element:
      id: "sample_setting_capture_mode"
    direction: DOWN
- assertVisible: "Manual"
- tapOn:
    id: "sample_setting_capture_mode"
- tapOn:
    id: "sample_capture_mode_option_autoWithFallback"
- assertVisible: "Automatic with manual fallback"
- scrollUntilVisible:
    element:
      id: "sample_setting_gallery_upload"
    direction: DOWN
