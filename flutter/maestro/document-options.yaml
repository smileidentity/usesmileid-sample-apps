appId: ${APP_ID}
---
# The document form's list, Capture as, generic-document sheet and Enhanced Document Verification's partner list on fixture lists, through SDK mount.

- clearState
- runFlow:
    file: subflows/cold-start.yaml
    env:
      LINK: "usesmileid-sample-flutter://?probes=true&catalogue=fixture"
      LANDS_ON: "sample_products_screen"
- runFlow: subflows/link-session.yaml

- tapOn:
    id: "sample_product_card_documentVerification"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "sample_user_details_screen"
    timeout: 30000
- tapOn:
    id: "sample_user_details_field_firstName"
- eraseText
- inputText: "Ada"
- tapOn:
    id: "sample_user_details_field_lastName"
- eraseText
- inputText: "Okafor"
- tapOn:
    id: "sample_user_details_field_email"
- eraseText
- inputText: "ada.okafor@example.com"
- hideKeyboard
- runFlow: subflows/keep-nothing.yaml
- tapOn:
    id: "sample_user_details_continue"

# The document products ask for a document and how to capture it, never an ID number.
- extendedWaitUntil:
    visible:
      id: "sample_kyc_form_screen"
    timeout: 30000
- assertNotVisible:
    id: "sample_idnumber_input"
- tapOn:
    id: "sample_country_trigger"
- assertVisible:
    id: "sample_country_sheet"
- tapOn:
    id: "sample_country_option_ZA"

# The Green Book is its own row after its parent; the API's 'Others', whose code is empty, is not listed.
- tapOn:
    id: "sample_document_trigger"
- assertVisible:
    id: "sample_document_option_IDENTITY_CARD"
- assertVisible:
    id: "sample_document_option_IDENTITY_CARD_green_book"
- assertNotVisible:
    id: "sample_document_option_"
- tapOn:
    id: "sample_document_option_IDENTITY_CARD_green_book"
- assertVisible:
    text: ".*Green Book.*"
    childOf:
      id: "sample_document_trigger"

# Untouched, Capture as matches the document: the Green Book row is the SDK's Green Book preset.
- assertVisible:
    text: ".*Green Book preset · matches document.*"
    childOf:
      id: "sample_capture_as_trigger"

# A passport row matches the Passport preset.
- tapOn:
    id: "sample_document_trigger"
- tapOn:
    id: "sample_document_option_PASSPORT"
- assertVisible:
    text: ".*Passport preset · matches document.*"
    childOf:
      id: "sample_capture_as_trigger"

# Match document first and selected, then the three overrides, each the SDK's own type.
- tapOn:
    id: "sample_capture_as_trigger"
- assertVisible:
    id: "sample_capture_as_sheet"
- assertVisible:
    id: "sample_capture_as_option_matchDocument"
    selected: true
- assertVisible:
    id: "sample_capture_as_option_genericDocument"
- assertVisible:
    id: "sample_capture_as_option_greenBook"
- assertVisible:
    id: "sample_capture_as_option_passport"

# Generic document opens its own sheet, and what it builds is named on the trigger.
- tapOn:
    id: "sample_capture_as_option_genericDocument"
- assertVisible:
    id: "sample_generic_document_sheet"
- tapOn:
    id: "sample_generic_document_name"
- eraseText
- inputText: "Booklet"
- hideKeyboard
- tapOn:
    id: "sample_generic_document_orientation_portrait"
- tapOn:
    id: "sample_generic_document_aspect_ratio_booklet"
- tapOn:
    id: "sample_generic_document_done"
- assertVisible:
    text: ".*Booklet.*chosen.*"
    childOf:
      id: "sample_capture_as_trigger"

# The Green Book preset chosen on the passport row, then through to the SDK: the flow host mounted with a document journey.
- tapOn:
    id: "sample_capture_as_trigger"
- tapOn:
    id: "sample_capture_as_option_greenBook"
- tapOn:
    id: "sample_kyc_continue"
- extendedWaitUntil:
    visible:
      id: "si_consent_screen"
    timeout: 30000
- tapOn: "Deny"
- extendedWaitUntil:
    visible:
      id: "sample_products_screen"
    timeout: 30000

# --- the list failing -------------------------------------------------------------------------------
# `unreachable` fails every list, and Retry fails again; entered by link, as a cold start forgets the details.
- runFlow:
    file: subflows/cold-start.yaml
    env:
      LINK: "usesmileid-sample-flutter://flow/documentVerification/id-details?catalogue=unreachable"
      LANDS_ON: "sample_kyc_form_screen"
- tapOn:
    id: "sample_country_trigger"
- extendedWaitUntil:
    visible:
      id: "sample_catalogue_error"
    timeout: 10000
- tapOn:
    id: "sample_catalogue_retry"
- extendedWaitUntil:
    visible:
      id: "sample_catalogue_error"
    timeout: 10000

# --- Enhanced Document Verification lists only the partner's enabled documents ---------------------
# The fixture's configuration enables Kenya's Identity Card and Passport and Nigeria's Passport, nothing else.
- runFlow:
    file: subflows/cold-start.yaml
    env:
      LINK: "usesmileid-sample-flutter://flow/enhancedDocumentVerification/id-details?catalogue=fixture"
      LANDS_ON: "sample_kyc_form_screen"
- tapOn:
    id: "sample_country_trigger"
- extendedWaitUntil:
    visible:
      id: "sample_country_option_KE"
    timeout: 10000
- assertVisible:
    id: "sample_country_option_NG"
- assertNotVisible:
    id: "sample_country_option_ZA"
- assertNotVisible:
    id: "sample_country_option_GH"
- tapOn:
    id: "sample_country_option_KE"
- tapOn:
    id: "sample_document_trigger"
- extendedWaitUntil:
    visible:
      id: "sample_document_option_IDENTITY_CARD"
    timeout: 10000
- assertVisible:
    id: "sample_document_option_PASSPORT"
- assertNotVisible:
    id: "sample_document_option_ALIEN_CARD"

# --- the Settings side ------------------------------------------------------------------------------
- runFlow:
    file: subflows/cold-start.yaml
    env:
      LINK: "usesmileid-sample-flutter://settings/capture-mode?catalogue=fixture"
      LANDS_ON: "sample_capture_mode_sheet"
- assertVisible:
    id: "sample_capture_mode_option_autoWithFallback"
    selected: true
- tapOn:
    id: "sample_capture_mode_option_manual"
# The sheet hands back to Settings, where the row sits below the fold; centred, clear of the nav bar.
- scrollUntilVisible:
    element:
      id: "sample_setting_capture_mode"
    direction: DOWN
    centerElement: true
# One node: the row merges its title and value into a single label.
- assertVisible:
    id: "sample_setting_capture_mode"
    text: ".*Manual.*"
- tapOn:
    id: "sample_setting_capture_mode"
- tapOn:
    id: "sample_capture_mode_option_autoWithFallback"
- assertVisible:
    id: "sample_setting_capture_mode"
    text: ".*Automatic with manual fallback.*"
- scrollUntilVisible:
    element:
      id: "sample_setting_gallery_upload"
    direction: DOWN
