name: Expo device

# The first lane in this repo that runs a flow against a running app. Everything else proves the
# library in a hostless runner, which cannot see touch layering, overlap or launch-argument plumbing
# — the two defects #113 and #114 fixed were both invisible to every other gate here.
#
# Separate from the Expo gate on purpose: this builds a release APK and boots an emulator, so it is
# minutes rather than seconds, and a fast gate is worth keeping fast.
on:
  pull_request:
    paths:
      - 'expo/**'
      - 'spec/**'
      - '.github/workflows/expo-device.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: expo-device-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The build fills this runner and the emulator package then has nowhere to land — the third
      # attempt died on "No space left on device" installing it. None of these are used here; the
      # Android SDK and NDK are deliberately untouched, because the native build needs both.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/share/swift \
            /usr/local/share/powershell /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: expo/pnpm-lock.yaml

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # AGP 9 lint calls JDK 21 APIs, matching the Android lane.
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: expo

      # The 22 minutes is openssl, quick-crypto, nitro-modules and worklets compiling from source.
      # setup-gradle caches ~/.gradle, which these are not in: they build inside each package's own
      # android directory, and pnpm relinks those from the store on every run. Keyed on the lockfile,
      # because that is the only thing that changes what the native build produces.
      - name: Cache the native build outputs
        uses: actions/cache@v6
        with:
          path: |
            expo/node_modules/**/android/.cxx
            expo/node_modules/**/android/build
          key: expo-native-${{ runner.os }}-${{ hashFiles('expo/pnpm-lock.yaml') }}
          restore-keys: expo-native-${{ runner.os }}-

      # Regenerated rather than committed, which is what stops a hand-patched Gradle file surviving.
      - name: Prebuild
        run: pnpm --filter usesmileid-sample-expo exec expo prebuild --platform android --clean
        working-directory: expo

      # Expo's prebuild writes -Xmx2048m, on which R8 reports "Compilation failed to complete" and
      # lint dies with Java heap space. Matched to android/gradle.properties, which this repo's own
      # Android app already builds with. Set in the Gradle user home because the project file is
      # regenerated by every prebuild, and appended because -Dorg.gradle.jvmargs on the command line
      # REPLACES the project value rather than merging with it.
      - name: Give Gradle the heap the Android app already uses
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties

      # Release, because that is the configuration a consumption defect surfaces in. The bundle is
      # forced: a release APK can otherwise ship the previous JS while reporting that it rebuilt one.
      #
      # One ABI, not four. Building all of them compiled openssl and quick-crypto four times over and
      # the runner was killed mid-compile with no Gradle error at all — the log simply stops. The
      # emulator is x86_64, so the other three were never going to be loaded here. Minification and
      # resource shrinking, which are what this configuration exists to exercise, are unaffected.
      - name: Build the release APK
        run: |
          ./gradlew :app:createBundleReleaseJsAndAssets --rerun :app:assembleRelease \
            -PreactNativeArchitectures=x86_64 \
            -Pandroid.enableMinifyInReleaseBuilds=true \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true
        working-directory: expo/app/android

      # The daemon holds a heap this runner needs back before an emulator will fit beside it.
      - name: Stop the Gradle daemon
        run: ./gradlew --stop
        working-directory: expo/app/android

      - name: Report the disk left for the emulator
        run: df -h / | tail -1

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The emulator needs nested virtualisation, which is not granted to the runner user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the device flows
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # A lock or a system ANR dialog reds every flow as the app's fault; an app crash still lands in logs/crash-report.txt.
          script: |
            adb shell locksettings set-disabled true
            adb shell settings put global hide_error_dialogs 1
            adb install -r expo/app/android/app/build/outputs/apk/release/app-release.apk
            maestro test -e APP_ID=com.usesmileid.sample.expo expo/maestro

      # A red here is a screen recording and a hierarchy, which is what makes it readable at all.
      - name: Upload the Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: expo-device-debug
          path: ~/.maestro/tests/**
          if-no-files-found: ignore
          retention-days: 7
