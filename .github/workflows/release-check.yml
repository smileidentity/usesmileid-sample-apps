name: Release check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'
  pull_request:
    paths:
      - 'android/play/**'
      - 'android/app/build.gradle.kts'
      - 'ios/store/**'
      - 'ios/App/project.yml'
      - 'ios/App/PrivacyInfo.xcprivacy'
      - 'ios/verify.sh'
      - '.github/workflows/release-check.yml'

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Bundle
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Report the delivered size
        working-directory: android
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          ls -l "$AAB" | awk '{printf "bundle: %.1f MB\n", $5/1048576}'

      - name: Store art is present and store-legal
        run: |
          FRAMES=android/sample-ui/src/test/store-art
          test -d "$FRAMES" || { echo "::error::no store-art directory"; exit 1; }
          fail=0
          for f in "$FRAMES"/*.png; do
            dim=$(python3 -c "import struct,sys;d=open('$f','rb').read(33);print(f'{struct.unpack(\">I\",d[16:20])[0]}x{struct.unpack(\">I\",d[20:24])[0]}')")
            if [ "$dim" != "1080x1920" ]; then
              echo "::error file=$f::$dim, expected 1080x1920 (the android-phone preset)"
              fail=1
            else
              echo "  $(basename "$f") $dim"
            fi
          done
          exit $fail

      - name: Feature graphic is store-legal
        run: |
          FG=android/play/feature-graphic.png
          test -f "$FG" || { echo "::error::Play requires a feature graphic and $FG is missing"; exit 1; }
          npx --yes -p storeshots-mcp storeshots validate --preset play-feature-graphic "$FG"

      - name: Rendered panels are store-legal, when they have been rendered
        run: |
          if [ -d android/play/screenshots ] && ls android/play/screenshots/*.png >/dev/null 2>&1; then
            for f in android/play/screenshots/*.png; do
              npx --yes -p storeshots-mcp storeshots validate --preset android-phone "$f"
            done
          else
            echo "::notice::no rendered panels yet — android/play/render-store-art.sh has not been run with a camera frame"
          fi

  archive:
    name: iOS archive and store art
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # No fetch-depth: the build number here is the run number, and this job runs no git command.
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          for candidate in /Applications/Xcode_${XCODE_VERSION}.app /Applications/Xcode.app; do
            if [ -d "$candidate" ]; then sudo xcode-select -s "$candidate"; break; fi
          done
          BUILD="$(xcodebuild -version | tail -1)"
          if [ "$BUILD" != "Build version $XCODE_BUILD" ]; then
            echo "::warning title=Xcode build drifted::The archive links against this runner's SDK, \
            and it is $BUILD rather than the pinned $XCODE_BUILD."
          fi
          xcodebuild -version
        env:
          XCODE_VERSION: "26.6"
          XCODE_BUILD: 17F113

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Panels are store-legal by the tool that made them
        run: |
          ls ios/store/screenshots/*.png >/dev/null 2>&1 \
            || { echo "::error::no rendered panels — run ios/store/render-store-art.sh"; exit 1; }
          for f in ios/store/screenshots/*.png; do
            npx --yes -p storeshots-mcp storeshots validate --preset ios-phone "$f"
          done

      # Unsigned on purpose: this lane holds no credential, and an archive that needs one would be
      # red on every PR. What it proves is that the shipped configuration still builds and still
      # declares the four things an upload is rejected for. verify.sh runs the listing check first.
      - name: Archive
        run: ios/verify.sh archive
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ARCHIVE_UNSIGNED: "1"
          EXPORT_ARCHIVE_ONLY: "1"

      - name: The archive declares what an upload is rejected for
        run: |
          APP=ios/build/UseSmileIDSample.xcarchive/Products/Applications/UseSmileIDSample.app/Info.plist
          fail=0
          check() {
            # -o - or plutil rewrites the plist it was asked to read, which then fails every later check.
            got="$(plutil -extract "$1" raw -o - "$APP" 2>/dev/null || echo MISSING)"
            if [ "$got" != "$2" ]; then
              echo "::error::$1 is '$got', expected '$2'"
              fail=1
            else
              echo "  $1 = $got"
            fi
          }
          check ITSAppUsesNonExemptEncryption false
          check CFBundleVersion "${{ github.run_number }}"
          # The whole array: UIDeviceFamily.0 reads 1 for [1,2] as well, so it proved nothing.
          got="$(plutil -extract UIDeviceFamily json -o - "$APP" 2>/dev/null || echo MISSING)"
          if [ "$got" != "[1]" ]; then
            echo "::error::UIDeviceFamily is '$got', expected [1] — the app is specified phone-only"
            fail=1
          else
            echo "  UIDeviceFamily = $got"
          fi
          test -f "$(dirname "$APP")/PrivacyInfo.xcprivacy" \
            || { echo "::error::the archive ships no privacy manifest"; fail=1; }
          exit $fail
