name: iOS

# CI runs ios/verify.sh itself, so the local contract and the gate cannot drift apart.
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'spec/**'
      - 'scripts/**'
      - '.github/workflows/ios.yml'
      - '.github/actions/select-xcode/**'
  push:
    branches: [main]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.class || 'checks' }}
    # One job per UI test class, plus one for everything else, because the UI suite was most of the
    # lane. Not simulator clones inside a single runner: measured at 35m against 43-49m serial, since
    # a runner gives xcodebuild two clones and they contend for its two cores — 20% off, and five
    # failures for it. A whole runner each is what actually parallelises.
    # `UseSmileIDSampleUiLaneSpecTest` asserts this list names every class, so a new one cannot
    # quietly go unrun.
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: checks
          - phase: ui
            class: UseSmileIDSampleNavigationUITests
          - phase: ui
            class: UseSmileIDSampleFlowUITests
          - phase: ui
            class: UseSmileIDSampleVerificationsUITests
          - phase: ui
            class: UseSmileIDSampleLaunchArgumentUITests
          - phase: ui
            class: UseSmileIDSampleSettingsUITests
          - phase: ui
            class: UseSmileIDSampleDocumentOptionsUITests
    # Goldens are pixel comparisons: they verify on select-xcode's Xcode and on the runtime DESTINATION names below.
    runs-on: xcode-27
    # The UI tests drive a cross-process system alert, which can hang where the earlier programmatic
    # steps could not; without this a wedged run holds the branch's concurrency group for hours.
    # Back to 45 now the suite is split: the headroom was for one serial job that had reached 44
    # minutes, and the longest job here is a single test class.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The pinned build is the one the goldens were recorded on, so a drift warning here explains a snapshot failure first.
      - uses: ./.github/actions/select-xcode

      # --check needs the design system, which is private; a fork PR gets no secret, so this skips and says so.
      - name: Check out the design system
        id: design-system
        if: env.DESIGN_SYSTEM_TOKEN != '' && env.DESIGN_SYSTEM_REPOSITORY != ''
        env:
          DESIGN_SYSTEM_TOKEN: ${{ secrets.DESIGN_SYSTEM_TOKEN }}
          DESIGN_SYSTEM_REPOSITORY: ${{ vars.DESIGN_SYSTEM_REPOSITORY }}
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.DESIGN_SYSTEM_REPOSITORY }}
          token: ${{ secrets.DESIGN_SYSTEM_TOKEN }}
          path: .design-system
          sparse-checkout: smile-design-system
          sparse-checkout-cone-mode: true

      - name: Note a skipped token check
        if: steps.design-system.outcome == 'skipped'
        run: |
          echo "::warning title=Design tokens not verified::No DESIGN_SYSTEM_TOKEN or DESIGN_SYSTEM_REPOSITORY available, so the \
          vendored token output was not compared against the design system. Everything else ran."

      - name: Install the build tools
        run: brew install xcodegen swiftformat

      - name: Verify
        env:
          SMILE_DESIGN_SYSTEM: ${{ steps.design-system.outcome == 'success' && format('{0}/.design-system/smile-design-system', github.workspace) || '' }}
          SMILE_TOKENS_OPTIONAL: ${{ steps.design-system.outcome == 'skipped' && '1' || '' }}
          # OS pinned because a runner image can also ship a newer iOS runtime; baselines are on 27.0.
          DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=27.0
        run: ios/verify.sh ${{ matrix.phase }} ${{ matrix.class }}

      - name: Upload the runner's rendering of failed goldens
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-goldens-recorded-${{ matrix.class || 'checks' }}
          path: ios/build/snapshot-artifacts/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the UI test result bundle when the lane reds
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-uitest-result-${{ matrix.class || 'checks' }}
          path: ios/build/*.xcresult
          if-no-files-found: ignore
