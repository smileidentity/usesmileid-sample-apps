# Select mode and the removal confirmation. Every assertion here stands for a defect reported on a
# device: the nav bar showing under the selection bar, and a spent confirmation coming back with you.
#
# APP_ID has no default on purpose: a flow-level `env:` default WINS over `-e` in Maestro 2.8, so
# one here would silently pin every run to a single variant.
#   maestro --device <serial> test -e APP_ID=com.usesmileid.sample.android android/maestro
appId: ${APP_ID}
---
# Rows are a precondition, not the subject: the app seeds none. Seeded once — they persist in Room.
- stopApp
- launchApp:
    arguments:
      seedJobs: true

- runFlow: subflows/warm-start.yaml
- tapOn:
    id: "sample_nav_verifications"
- assertVisible:
    id: "sample_verifications_screen"
- assertVisible:
    id: "sample_nav_products"

# Select mode replaces the bottom chrome: the design has no nav bar behind the selection bar.
- tapOn:
    id: "sample_select_toggle"
- assertVisible:
    id: "sample_selection_bar"
- assertNotVisible:
    id: "sample_nav_products"
- assertNotVisible:
    id: "sample_nav_token"

- tapOn:
    id: "sample_selection_checkbox_0"
- assertVisible: "1 selected"

# Cancelling gives the nav bar back.
- tapOn:
    id: "sample_select_toggle"
- assertNotVisible:
    id: "sample_selection_bar"
- assertVisible:
    id: "sample_nav_products"

# Hide from List, and the confirmation offers the undo.
- tapOn:
    id: "sample_select_toggle"
- tapOn:
    id: "sample_selection_checkbox_0"
- tapOn:
    id: "sample_selection_remove"
- assertVisible:
    id: "sample_toast"
- assertVisible: "1 verification hidden from App list"

# The window expires on its own, and a spent confirmation does not come back with you: opening a
# verification and pressing back used to replay it, because the trigger was saved across the trip.
- extendedWaitUntil:
    notVisible:
      id: "sample_toast"
    timeout: 10000
- tapOn:
    id: "sample_job_row_0"
- assertVisible:
    id: "sample_verification_details_screen"
# Reached by TAPPING, not by deep link. Whether a screen carries a bar is a property of the
# destination, so a check that covers one arrival route would let the other hide a regression.
- assertNotVisible:
    id: "sample_nav_products"
- assertNotVisible:
    id: "sample_nav_token"
- back
- assertVisible:
    id: "sample_verifications_screen"
- assertNotVisible:
    id: "sample_toast"

# Pull-to-refresh. A seeded row has no scanned session, so the outcome is deterministic and needs no network.
- tapOn:
    id: "sample_job_row_0"
- assertVisible:
    id: "sample_details_refresh"
# An explicit long, slow drag: a short DOWN swipe does not cross the refresh threshold.
- swipe:
    start: 50%, 30%
    end: 50%, 79%
    duration: 600
- assertVisible:
    id: "sample_toast"
- assertVisible: "Not submitted under a scanned token"
