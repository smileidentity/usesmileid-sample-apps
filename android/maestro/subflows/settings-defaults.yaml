# Puts every switch back where the app ships it, tapping only what has moved. Run at BOTH ends of
# settings.yaml: a flow that turns the consent screen off and then fails takes `si_consent_screen`
# away from every flow after it, which is what happened on the first device pass.
appId: ${APP_ID}
---
- tapOn:
    id: "sample_nav_settings"
- assertVisible:
    id: "sample_settings_screen"
# The tab keeps its scroll position, so scroll the sheet rows into view.
- scrollUntilVisible:
    element:
      id: "sample_setting_appearance"
    direction: UP
    centerElement: true
# Language first, so later text assertions read English.
- tapOn:
    id: "sample_setting_language"
- tapOn:
    id: "sample_language_option_system"
- assertNotVisible:
    id: "sample_language_sheet"
# Appearance back to System, checked on the sheet: the row's label names the device's theme.
- tapOn:
    id: "sample_setting_appearance"
- tapOn:
    id: "sample_appearance_option_system"
- assertNotVisible:
    id: "sample_appearance_sheet"
# Enhanced first: the mutex turns Agent mode off on its way, so the pair needs one tap, not two.
- runFlow:
    when:
      visible:
        id: "sample_setting_enhanced_smart_selfie"
        checked: false
    commands:
      - tapOn:
          id: "sample_setting_enhanced_smart_selfie"
- runFlow:
    when:
      visible:
        id: "sample_setting_agent_mode"
        checked: true
    commands:
      - tapOn:
          id: "sample_setting_agent_mode"
- runFlow:
    when:
      visible:
        id: "sample_setting_consent_step"
        checked: false
    commands:
      - tapOn:
          id: "sample_setting_consent_step"
- runFlow:
    when:
      visible:
        id: "sample_setting_instructions_step"
        checked: false
    commands:
      - tapOn:
          id: "sample_setting_instructions_step"
# Below the fold since the Language section.
- scrollUntilVisible:
    element:
      id: "sample_setting_preview_step"
    centerElement: true
- runFlow:
    when:
      visible:
        id: "sample_setting_preview_step"
        checked: false
    commands:
      - tapOn:
          id: "sample_setting_preview_step"
- scrollUntilVisible:
    element:
      id: "sample_setting_enhanced_smart_selfie"
    direction: UP
    centerElement: true
- assertVisible:
    id: "sample_setting_enhanced_smart_selfie"
    checked: true
- assertVisible:
    id: "sample_setting_agent_mode"
    checked: false
- assertVisible:
    id: "sample_setting_consent_step"
    checked: true
- assertVisible:
    id: "sample_setting_instructions_step"
    checked: true
- scrollUntilVisible:
    element:
      id: "sample_setting_preview_step"
    centerElement: true
- assertVisible:
    id: "sample_setting_preview_step"
    checked: true
# The document-capture rows sit below the first screen too, each at the SDK's default; selfie first off.
- scrollUntilVisible:
    element:
      id: "sample_setting_gallery_upload"
    centerElement: true
- runFlow:
    when:
      notVisible: "Automatic with manual fallback"
    commands:
      - tapOn:
          id: "sample_setting_capture_mode"
      - tapOn:
          id: "sample_capture_mode_option_autoWithFallback"
- runFlow:
    when:
      visible:
        id: "sample_setting_gallery_upload"
        checked: true
    commands:
      - tapOn:
          id: "sample_setting_gallery_upload"
- assertVisible: "Automatic with manual fallback"
- assertVisible:
    id: "sample_setting_gallery_upload"
    checked: false
- scrollUntilVisible:
    element:
      id: "sample_setting_selfie_first"
    centerElement: true
- runFlow:
    when:
      visible:
        id: "sample_setting_allow_skip_back"
        checked: true
    commands:
      - tapOn:
          id: "sample_setting_allow_skip_back"
- runFlow:
    when:
      visible:
        id: "sample_setting_selfie_first"
        checked: true
    commands:
      - tapOn:
          id: "sample_setting_selfie_first"
- assertVisible:
    id: "sample_setting_allow_skip_back"
    checked: false
- assertVisible:
    id: "sample_setting_selfie_first"
    checked: false
# Back to the top, where the flows that follow expect the list.
- scrollUntilVisible:
    element:
      id: "sample_setting_enhanced_smart_selfie"
    direction: UP
