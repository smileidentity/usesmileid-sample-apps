appId: ${APP_ID}
---
# The SDK flow handoff: the route exists, the host mounts, its gate refuses a flow the SDK would
# reject, and the wizard stacks above the tabs.
#
# It stops short of the SDK's own screens, and the reason is the runner rather than the app: once a
# text field on this app is focused, Maestro's driver stops reporting the app's hierarchy at all —
# uiautomator still sees every field, and it reproduces on `main`'s APK. Reaching consent needs the
# user-details form filled, so this flow cannot type and the SDK-screen assertions live in the
# Flutter twin until that is solved. See ./README.md "Traps".
#
# Launch arguments arrive as a LINK on this platform — see ./README.md "Traps".

# The job store survives the run, and a sibling flow in the same suite seeds it, so the empty-list
# assertion below needs the slate cleared rather than merely a fresh launch.
- clearState
- stopApp
# A cold link straight at the flow: the route resolves, the host reads its snapshot, and the gate
# refuses an empty form rather than handing the SDK a payload its own validators reject.
- openLink: "usesmileid-sample-expo:///flow/smartSelfieEnrollment/run"
# The form, not the grid: the gate reads the SDK's own validators, finds the details missing and
# sends the journey to the step that can still supply them.
- extendedWaitUntil:
    visible:
      id: "sample_user_details_screen"
    timeout: 60000
- assertNotVisible:
    id: "sample_nav_products"

# Relaunched rather than backed out of: on a cold link the form is the stack's only entry, so the
# system back leaves the app rather than reaching the grid.
- stopApp
- openLink: "usesmileid-sample-expo://?noticeWindow=60"
- runFlow: subflows/warm-start.yaml

# Nothing was submitted, so nothing was stored: a refused run must not leave a row behind.
- tapOn:
    id: "sample_nav_verifications"
- assertVisible:
    id: "sample_verifications_screen"
- assertVisible:
    id: "sample_filter_count_all"
    text: "0"
- tapOn:
    id: "sample_nav_products"
- assertVisible:
    id: "sample_products_screen"

# The wizard covers the tabs, and back returns to the grid rather than stranding on the form.
- tapOn:
    id: "sample_product_card_smartSelfieEnrollment"
- extendedWaitUntil:
    visible:
      id: "sample_user_details_screen"
    timeout: 30000
- assertNotVisible:
    id: "sample_nav_products"
- back
- extendedWaitUntil:
    visible:
      id: "sample_products_screen"
    timeout: 30000

# With probes, a release build puts the card in the tree even for a job id that resolves to nothing.
- stopApp
- openLink: "usesmileid-sample-expo:///verifications/job-missing?probes=true"
- extendedWaitUntil:
    visible:
      id: "sample_result_card"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "sample_result_result_count"
    direction: DOWN
- assertVisible:
    id: "sample_result_result_count"
    text: "0"
